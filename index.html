<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NPCAgent</title>
<meta name="theme-color" content="#10140f">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='3' fill='%230a0d0b'/><circle cx='16' cy='10' r='6' fill='%23d99e57'/><rect x='13' y='8' width='2.5' height='3' rx='1' fill='%230a0d0b'/><rect x='16.5' y='8' width='2.5' height='3' rx='1' fill='%230a0d0b'/><path d='M13.5 14.5 Q16 16.5 18.5 14.5' fill='none' stroke='%230a0d0b' stroke-width='1' stroke-linecap='round'/><rect x='11' y='18' width='10' height='11' rx='3' fill='%23d99e57' opacity='.85'/><circle cx='24' cy='6' r='2' fill='%235fc46b' opacity='.85'/></svg>">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@xterm/xterm@6.0.0/css/xterm.css" integrity="sha384-n2n7twoohnW+d3myBKaUgl7DSiwidw6MkQy9oesGzkPpMjejKRR3XlnD+5yCdtBD" crossorigin="anonymous">
<style>
  /* palette: amber = operator's hand, moss = life inside, blood = death/fault */
  :root{
    --void:#080a09; --glass:#0d100e; --panel:#10140f; --edge:#262d23; --ctl:#5a6752;   /* --ctl = control boundary: --edge is 1.31:1 on the bar, so fields read as invisible; this clears the 3:1 WCAG 1.4.11 floor */
    --fg:#ccd5c4; --muted:#8b9583; --amber:#d99e57; --moss:#5fc46b; --blood:#d96a5a;
    color-scheme:dark;
  }
  *{ box-sizing:border-box; }
  html,body{ height:100%; margin:0; }
  body{ display:flex; flex-direction:column; height:100vh; height:100dvh; background:var(--void); color:var(--fg);
        font:13px/1.4 "Cascadia Code","Cascadia Mono","JetBrains Mono",Consolas,monospace; }

  /* control deck */
  #bar{ flex:0 0 auto; display:flex; flex-wrap:nowrap; align-items:flex-end; gap:4px 6px; padding:6px 8px 5px;
        background:var(--panel); border-bottom:1px solid var(--edge);
        overflow-x:auto; overflow-y:hidden; scrollbar-width:none; -webkit-overflow-scrolling:touch;   /* one scrollable row - scroll right for more, no wrap/dropdown */
        --mL:0px; --mR:0px;   /* edge fades toggled by JS to hint horizontal scroll */
        -webkit-mask-image:linear-gradient(to right, transparent 0, #000 var(--mL), #000 calc(100% - var(--mR)), transparent 100%);
                mask-image:linear-gradient(to right, transparent 0, #000 var(--mL), #000 calc(100% - var(--mR)), transparent 100%); }
  #bar::-webkit-scrollbar{ display:none; }
  #bar > *{ flex:0 0 auto; }   /* never squish - overflow into the scroll instead */
  #brand{ margin-right:8px; padding-bottom:5px; user-select:none; }
  #word{ font-size:15px; font-weight:700; letter-spacing:.1em; line-height:1; white-space:nowrap;
         color:var(--fg); text-decoration:none; }
  #word b{ color:var(--amber); }

  .fld{ display:flex; flex-direction:column; gap:1px; min-width:0; animation:fieldIn .35s ease backwards; }
  .fld .tag{ font-size:11px; line-height:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); transition:color .15s; }  /* same 11px as the inputs; tight line-height keeps control positions unchanged */
  .fld:focus-within .tag{ color:var(--amber); }
  /* The two model controls sit inside the Model field but are not the field. Without this, clicking the upload
     button lands focus in .fld and :focus-within lights the MODEL caption amber, which reads as "this input is
     active" when nothing was typed. Focus cannot be on the input and a button at once, so a flat override is safe. */
  .fld:has(#gguf:focus, #ggufGet:focus) .tag{ color:var(--muted); }
  .fld.collapsed{ display:none; }   /* explicit field hide; simpler and less fragile than the previous :has() rule */
  #bar .fld:nth-of-type(2){ animation-delay:.04s; } #bar .fld:nth-of-type(3){ animation-delay:.08s; }
  #bar .fld:nth-of-type(4){ animation-delay:.12s; } #bar .fld:nth-of-type(5){ animation-delay:.16s; }
  #bar .fld:nth-of-type(6){ animation-delay:.2s; } #bar .fld:nth-of-type(7){ animation-delay:.24s; }
  @keyframes fieldIn{ from{ opacity:0; transform:translateY(-4px); } }

  #bar input, #bar select{ height:22px; padding:0 4px; background:var(--void); color:var(--fg);
              border:1px solid var(--ctl); border-radius:1px; outline:none; font:inherit; font-size:11px; min-width:0;
              transition:border-color .15s, background-color .15s; }
  #bar input:hover, #bar select:hover{ border-color:#7d8a73; }
  #bar input:focus, #bar select:focus{ border-color:var(--amber); }
  #bar input.hidden, #bar select.hidden{ display:none; }
  #bar input:disabled, #bar select:disabled{ opacity:.35; pointer-events:none; }
  #engine{ width:140px; } #baseUrl{ width:170px; } #apiKey{ width:80px; }
  #model, #modelSelect{ width:130px; } #player{ width:75px; } #days{ width:46px; text-align:center; }
  #traitWho{ width:52px; } #traitVal{ width:70px; }
  .fld:has(#traitWho){ flex-direction:row; flex-wrap:wrap; align-items:flex-end; }
  .fld:has(#traitWho) .tag{ width:100%; }
  #days::-webkit-inner-spin-button, #days::-webkit-outer-spin-button{ -webkit-appearance:none; margin:0; }
  #contribBox{ display:flex; align-items:center; gap:4px; align-self:flex-end; height:22px; cursor:pointer; user-select:none; position:relative; }
  #contribBox .tag{ cursor:pointer; }
  #contribBox input{ accent-color:var(--amber); margin:0; cursor:pointer; transition:opacity .2s; }
  #contribBox input:focus-visible{ outline:2px solid var(--amber); outline-offset:2px; }   /* border-color does nothing on a checkbox, so this was an invisible tab stop */
  #contribBox:hover .tag{ color:var(--amber); }
  /* archive status rides the checkbox instead of a terminal line: ring while uploading, one flash on the result, detail in the tooltip */
  #contribBox::after{ content:""; position:absolute; left:-4px; top:50%; margin-top:-10.5px; width:19px; height:19px;
                      border:1px solid transparent; border-radius:50%; opacity:0; pointer-events:none; }
  #contribBox.busy::after{ opacity:1; border-top-color:var(--amber); animation:ringSpin .7s linear infinite; }
  #contribBox.busy input{ opacity:.35; }
  #contribBox.ok::after, #contribBox.err::after{ animation:ringPop .55s ease-out; }
  #contribBox.ok::after{ border-color:var(--amber); }
  #contribBox.err::after{ border-color:var(--blood); }
  @keyframes ringSpin{ to{ transform:rotate(360deg); } }
  @keyframes ringPop{ from{ opacity:1; transform:scale(.55); } to{ opacity:0; transform:scale(1.5); } }
  @media (prefers-reduced-motion:reduce){ #contribBox::after{ animation:none; } #contribBox.busy::after{ opacity:1; } }

  #run{ height:22px; padding:0 14px; align-self:flex-end; background:var(--amber); color:#0b0c09;
        border:1px solid var(--amber); border-radius:2px; font:inherit; font-size:11px; font-weight:700;
        letter-spacing:.22em; text-transform:uppercase; cursor:pointer;
        transition:background-color .15s, color .15s, border-color .15s; }
  #run:hover{ background:#e7b06b; border-color:#e7b06b; }
  #run:disabled{ opacity:.4; cursor:default; animation:none; }
  #run:focus-visible{ outline:2px solid var(--fg); outline-offset:2px; }
  #dl:focus-visible{ outline:2px solid var(--amber); outline-offset:2px; }
  #dl{ height:22px; width:auto; padding:0 4px; gap:2px; margin-left:auto; align-self:flex-end; display:flex; align-items:center; justify-content:center;
        background:var(--void); color:var(--amber); border:1px solid var(--edge); border-radius:2px; cursor:pointer;
        transition:border-color .15s, background-color .15s; }   /* margin-left:auto pins dl + Share to the right on wide screens; collapses to 0 when the bar overflows */
  #dl:hover:not(:disabled){ border-color:#3d473a; }
  #dl:focus:not(:disabled), #dl:active:not(:disabled){ border-color:var(--amber); }
  #dl:disabled{ opacity:.3; cursor:default; }
  /* Self-packager: same chrome as #dl but no margin-left:auto, so it sits directly beside it rather than claiming the gap */
  #pack{ height:22px; width:auto; padding:0 4px; gap:2px; align-self:flex-end; display:flex; align-items:center; justify-content:center;
        background:var(--void); color:var(--moss); border:1px solid var(--edge); border-radius:2px; cursor:pointer;
        transition:border-color .15s, background-color .15s; }
  #pack b{ font:700 12px/1 ui-monospace,SFMono-Regular,Menlo,monospace; letter-spacing:.02em; }
  #pack:hover:not(:disabled){ border-color:#3d473a; }
  #pack:focus-visible{ outline:2px solid var(--amber); outline-offset:2px; }
  #pack:disabled{ opacity:.3; cursor:default; }
  #pack.hidden{ display:none; }
  /* Tag row: the field's caption plus the two model controls on one line. Kept to the .tag line-height so the
     input below stays level with every other field's input (#bar aligns to flex-end, so only this row grows). */
  .tagrow{ display:flex; align-items:center; gap:5px; min-width:0; height:14px; }
  #ggufGet{ color:var(--amber); font:inherit; font-size:10px; letter-spacing:.04em; text-transform:uppercase;
            text-decoration:underline; white-space:nowrap; cursor:pointer; }
  #ggufGet:hover{ color:#e7b06b; }
  #ggufGet.hidden{ display:none; }
  /* the typed path is kept but visibly not in play once a file is loaded from disk */
  #model.superseded{ opacity:.42; text-decoration:line-through; text-decoration-thickness:1px; }
  #ggufArrow{ color:var(--muted); font-size:10px; line-height:1; user-select:none; pointer-events:none; }
  #ggufArrow.hidden{ display:none; }
  #gguf{ height:14px; width:18px; display:flex; align-items:center; justify-content:center; flex:0 0 auto;
         background:var(--void); color:var(--amber); border:1px solid var(--edge); border-radius:2px; padding:0; cursor:pointer;
         transition:border-color .15s, background-color .15s; }
  #gguf:hover{ border-color:#3d473a; }
  #gguf:focus-visible{ outline:2px solid var(--amber); outline-offset:2px; }
  #gguf.hidden{ display:none; }
  body[data-state="dormant"] #run, body[data-state="ended"] #run, body[data-state="fault"] #run{
        animation:beacon 2.8s ease-in-out infinite; }
  body[data-state="waking"] #run, body[data-state="live"] #run{
        background:transparent; color:var(--blood); border-color:var(--blood); }
  body[data-state="waking"] #run:hover, body[data-state="live"] #run:hover{ background:rgba(217,106,90,.12); }
  @keyframes beacon{ 0%,100%{ box-shadow:0 0 0 0 rgba(217,158,87,0); } 50%{ box-shadow:0 0 0 4px rgba(217,158,87,.16); } }

  /* the glass: the pane you watch them through */
  #term{ flex:1 1 auto; min-height:0; position:relative; padding:6px 8px 0; overflow:hidden; background:var(--glass);
         margin:6px 8px 0; border:1px solid var(--edge); border-bottom:0; }
  #term::after{ content:""; position:absolute; inset:0; pointer-events:none;
                background:repeating-linear-gradient(0deg, rgba(2,4,3,.20) 0 1px, transparent 1px 3px); }
  /* rewind picker - double-esc. Truncating sess.log is the same operation a diverged replay already performs. */
  #rw{ position:fixed; inset:0; z-index:60; display:none; align-items:center; justify-content:center; background:rgba(2,4,3,.72); }
  #rwBox{ display:flex; flex-direction:column; width:min(860px,92vw); max-height:76vh;
          background:var(--panel); border:1px solid var(--edge); box-shadow:0 10px 40px rgba(0,0,0,.6); }
  #rwHead,#rwFoot{ padding:7px 12px; font-size:11px; color:var(--muted); border-bottom:1px solid var(--edge); }
  #rwFoot{ border-bottom:0; border-top:1px solid var(--edge); }
  #rwHead b{ color:var(--amber); font-weight:normal; }
  #rwList{ overflow-y:auto; flex:1; }
  #rwList div{ display:flex; gap:8px; padding:3px 12px; white-space:nowrap; cursor:pointer; }
  #rwList div.sel{ background:var(--edge); }
  #rwList .day{ flex:0 0 66px; color:var(--muted); font-variant-numeric:tabular-nums; }
  #rwList .who{ flex:0 0 84px; overflow:hidden; text-overflow:ellipsis; color:var(--amber); }
  #rwList div.you .who{ color:var(--fg); }
  #rwList .said{ overflow:hidden; text-overflow:ellipsis; color:var(--fg); }
  #rwList div.sel .said{ color:#fff; }
  #rwEditWrap{ display:none; padding:8px 12px; border-top:1px solid var(--edge); }
  #rwEdit{ width:100%; padding:5px 7px; background:var(--void); color:var(--fg); border:1px solid var(--amber);
           border-radius:2px; font:inherit; resize:vertical; }
  #dl.load svg{ transform:rotate(180deg); }
  .xterm,.xterm-viewport{ background:var(--glass)!important; }
  .xterm-viewport::-webkit-scrollbar{ width:8px; }
  .xterm-viewport::-webkit-scrollbar-thumb{ background:var(--edge); border-radius:4px; }

  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{ animation:none!important; transition:none!important; }
  }

  /* The bar is one non-wrapping scroll row. That reads well on a desktop and is unusable on a phone: the controls
     measure 969px against a 390px screen, so Subject, Days, Trait, both download buttons and the Share toggle sit
     579px off the right edge with only a thin fade hinting they exist. Wrap instead below 760px - a taller bar costs
     a few rows of terminal, an unreachable control costs the feature. */
  @media (max-width:760px){
    #bar{ flex-wrap:wrap; overflow-x:hidden; -webkit-mask-image:none; mask-image:none; }
    #bar > *{ flex:0 1 auto; }
    #bar input, #bar select{ max-width:38vw; }   /* Model alone claimed 130px of the 390 */
    #brand{ margin-right:4px; }
    #dl{ margin-left:auto; }                     /* keep the two download buttons together at the end of their row */
    #term{ padding:4px 5px 0; }
  }
</style>
</head>

<body>
  <div id="bar">
    <div id="brand"><a id="word" href="https://github.com/PsychoSmiley/NPCAgent" target="_blank" rel="noopener">NPC<b>Agent</b></a></div>
    <button id="run">Run</button>
    <label class="fld"><span class="tag">Engine</span>
      <select id="engine" title="Where the NPC brain runs">
        <option value="free" selected>Free (no key)</option>
        <option value="chatgpt">ChatGPT Codex</option>
        <option value="local">Local GGUF (~2 GB)</option>
        <option value="endpoint">Custom endpoint</option>
      </select>
    </label>
    <!-- multiple: a single gguf cannot exceed 2GB (emscripten's ftell is MAX_LONG-bound), so anything larger ships as
         split parts. wllama sorts them itself by the -00001-of-0000N suffix; it just has to be handed all of them. -->
    <input type="file" id="ggufFile" accept=".gguf" multiple class="hidden">
    <label class="fld"><span class="tag">Base URL</span>
      <input id="baseUrl" value="http://127.0.0.1:5000/v1" class="hidden" title="OpenAI-compatible base URL (endpoint mode)">
    </label>
    <label class="fld"><span class="tag">Key</span>
      <input id="apiKey" type="password" value="" placeholder="key" class="hidden" title="Bearer key - stays in this page, sent only to your URL">
    </label>
    <!-- a div, not a label: <button> is a labelable element, so a button inside <label class="fld"> would steal the
         label from #model and clicking the word "MODEL" would pop the file dialog. Both controls belong on this
         field's tag row because they only ever act on the model it names. -->
    <div class="fld"><span class="tagrow"><span class="tag">Model</span>
      <!-- a real anchor, not a terminal line: xterm has no link addon here, and this must stay clickable on file:// -->
      <a id="ggufGet" class="hidden" target="_blank" rel="noopener" title="Download this .gguf from HuggingFace in your browser, then load it with the button beside this link. This is the offline route: the page never downloads it itself.">get model</a>
      <!-- the arrow is signage, not a control: it points from the download link at the button you press next, so it
           sits OUTSIDE the anchor (inside it, it would be underlined and clickable, implying a third thing to click) -->
      <span id="ggufArrow" class="hidden" aria-hidden="true">&rarr;</span>
      <!-- arrow ascending OUT of a box: "load a model from disk", the mirror of #pack's descending arrow -->
      <button id="gguf" type="button" class="hidden" title="Load a .gguf model from your disk. No download and no browser storage, so this is the only path that works fully offline (and the only one that works at all from a double-clicked file)"><svg width="12" height="12" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.87" stroke-linecap="round" stroke-linejoin="round"><path d="M7 6.8V1.3M4.8 3.5 7 1.3l2.2 2.2"/><path d="M1.5 8v4.5h11V8"/></svg></button>
    </span>
      <select id="modelSelect" title="Free model id"></select>
      <input id="model" placeholder="model (auto)" class="hidden" title="Model id - blank picks automatically">
    </div>
    <label class="fld" id="effortFld"><span class="tag">Effort</span>
      <select id="effort" title="Reasoning depth - deeper answers cost more of your plan's quota"></select>
    </label>
    <label class="fld"><span class="tag">Subject</span>
      <input id="player" value="PersonX" placeholder="AI if empty" title="Your agent name - clear this to run AI-only (then Days appears)">
    </label>
    <label class="fld"><span class="tag">Days</span>
      <input id="days" type="number" value="2" min="1" max="6000" title="AI-only run length (a human run is unlimited; aging ends it). Max 6000 = ~200 in-game years.">
    </label>
    <label class="fld"><span class="tag">Trait</span>
      <select id="traitWho" title="Pick agent to set personality">
        <option value="0">Bob</option><option value="1">Alice</option><option value="2">Chloe</option>
      </select>
      <input id="traitVal" placeholder="none" title="Personality trait for this agent">
    </label>
    <input type="file" id="dlFile" accept=".json,application/json" class="hidden">
    <button id="dl" title="Save this run: a ShareGPT history (dataset) AND a resumable run file you can load back" disabled><svg width="15" height="15" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M7 1v7M3.5 5 7 8.5 10.5 5M2 10.5V13h10v-2.5"/></svg><svg width="15" height="15" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="1.4" y="2.2" width="11.2" height="7.6" rx="1.6"/><path d="M4.6 9.8v2.9L8.2 9.8"/></svg></button>
    <!-- arrow descending INTO a box: "download the game itself", distinct from #dl's plain arrow ("save this run") -->
    <button id="pack" title="Download the game: packages this page into one standalone HTML you can double-click offline"><svg width="15" height="15" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M7 1v5.5M4.8 4.6 7 6.8l2.2-2.2"/><path d="M1.5 8v4.5h11V8"/></svg><b>HTML</b></button>
    <label id="contribBox" title="Upload this run's log to a research archive at the end of each in-game day. Opt-in, on by default; your choice is remembered. A player run's upload includes what you type - unchecking mid-run also withdraws anything already sent.">
      <input type="checkbox" id="contrib" checked><span class="tag">Share log daily</span>
    </label>
  </div>
  <div id="term"></div>
  <div id="rw"><div id="rwBox" tabindex="-1">
    <div id="rwHead"><b>up/down</b> pick a point &middot; <b>enter</b> rewind to it &middot; <b>s</b> save this run to a file &middot; <b>esc</b> or click outside to cancel</div>
    <div id="rwList"></div>
    <div id="rwEditWrap"><textarea id="rwEdit" rows="3" spellcheck="false"></textarea></div>
    <div id="rwFoot"></div>
  </div></div>

  <!-- SRI-pinned: libcurl.js performs the TLS for token-bearing calls, so a swapped CDN copy could read them.
       NOTE this does not close the CDN threat: Pyodide and wllama are dynamic imports from the same host with no
       integrity attribute (loadPyodide also fetches its wasm/stdlib from indexURL), and they run with identical
       authority in this origin. A jsdelivr compromise is accepted risk, not a mitigated one. -->
  <script src="https://cdn.jsdelivr.net/npm/@xterm/xterm@6.0.0/lib/xterm.js" integrity="sha384-f/1U6Z9wM4D71a5eRXEZnyOTMOvjqxr2XLwh+Go1OvIl3L3tOcvUrzudnhbECwl4" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@xterm/addon-fit@0.11.0/lib/addon-fit.js" integrity="sha384-txoiwu4RR2GD3qySbaj+BbzibkLbSJRcfqGYMu6z1EqHil4A2dyBiBW5dlacG6OR" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/libcurl.js@0.6.20/libcurl_full.js" integrity="sha384-tj2Coxzq6T2/BiCRqVSYvXA3SY0rxd9Wq8bfMgWN7JtNxP/4H4NiK13VM3ifWYWo" crossorigin="anonymous" defer></script>

  <!-- Empty in the repo, so the dev layout always fetches ./npc.py and picks up live edits. build_single.py fills this
       with base64(npc.py) to produce a one-file NPCAgent.html that works when double-clicked. type="text/plain" so it
       is inert markup rather than script. -->
  <script type="text/plain" id="npcpy"></script>
  <!-- Filled only by the packager. A file:// page is a unique origin, so it cannot create a worker from a CDN script
       and the local-model tier died there. Blob URLs inherit the page's origin and ARE allowed to back a worker, so
       the standalone carries wllama itself and loads it from blob: instead of jsdelivr. ~10 MB, download only. -->
  <script type="text/plain" id="wllamajs"></script>
  <script type="text/plain" id="wllamawasm"></script>
  <!-- Pyodide runs npc.py, so without these the standalone still needed a network to START, local model or not.
       pyodide.mjs resolves the rest by URL, so the runtime serves them through a patched fetch. -->
  <script type="text/plain" id="pyomjs"></script>
  <script type="text/plain" id="pyoasmjs"></script>
  <script type="text/plain" id="pyowasm"></script>
  <script type="text/plain" id="pyostdlib"></script>
  <script type="text/plain" id="pyolock"></script>
  <script type="module">
  /* ------------------------------------------------------------------ config */
  const WLLAMA_ESM  = "https://cdn.jsdelivr.net/npm/@wllama/wllama@3.5.1/esm/index.js";
  const WLLAMA_WASM = { "default": "https://cdn.jsdelivr.net/npm/@wllama/wllama@3.5.1/esm/wasm/wllama.wasm" };
  const HF_DEFAULT  = "mradermacher/Gemma-3-R1984-4B-GGUF/Gemma-3-R1984-4B.Q3_K_M.gguf";
  function parseGguf(s){ let p=(s||HF_DEFAULT).trim()||HF_DEFAULT; const i=p.indexOf("/",p.indexOf("/")+1); if(i<0) p=HF_DEFAULT; const j=p.indexOf("/",p.indexOf("/")+1); return { repo:p.slice(0,j), file:p.slice(j+1) }; }  // <2 slashes (e.g. an endpoint model id after a tier switch) -> fall back to default, never emit garbage repo/file
  const N_CTX       = 8192;
  const MAX_TOKENS_CAP = 256;

  // One hardcoded relay is a single point of failure twice over: a relay can die outright (4 of 31 probed on
  // 2026-08-18 were already gone) and a live one can be refused by the upstream. All 30 below answered a real

  // ever reached by hopRelay() after a refusal, so a healthy run never touches them.

  }
  const speakerOf = bodyJson => {   // the reply alone never says who spoke; npc.py's system prompt opens "You are Bob," so take it from the request

  let lastSave = 0, saving = false, pendingDay = 0, tainted = false, savedDay = -1, savedLen = -1, tooBig = false, bad400 = 0, withdrawing = false;

  function ridAll(){

  /* ------------------------------------------------------------------ bridges */
  let wll = null, pyodide = null, running = false;
  const sleepMs = ms => new Promise(r => setTimeout(r, ms));
  // Safety net: every tier assigns _httpRaw, but a lost generation race could leave none installed. An empty turn is
  // something npc.py already handles; calling undefined would take the whole run down with a TypeError.
  // WAIT for an engine, never fake a turn. Returning "" here would be recorded by sessPush as the model's real reply,
  // so a missing sign-in would permanently write empty turns into the deterministic log. Blocking costs nothing and is
  // reversible: pick any engine in the dropdown - that click also carries the user activation a sign-in popup needs.
  const noEngine = async bodyJson => {
    writeErr("\r\n[LLM] no engine - pick one in the ENGINE dropdown above. The run waits here, nothing is lost.\r\n");
    while(globalThis._httpRaw === noEngine && running) await sleepMs(500);
    return globalThis._httpRaw === noEngine ? "" : globalThis._httpRaw(bodyJson);   // "" only if the run was stopped out from under us
  };
  globalThis._httpRaw = noEngine;
  // the sim only ever calls httpComplete; bridges swap _httpRaw underneath so recording survives engine switches.
  // The wait-out retry lives HERE, below sessNext/above sessPush, so one logical call records exactly one event:
  // retrying in the Python shim instead would log one "" per attempt and make replay re-sleep through outages.
  globalThis.httpComplete = async (bodyJson, tries = 1) => {

    if(c !== null) return c;

    for(let attempt = 0; attempt < tries; attempt++){
      if(attempt) await sleepMs(Math.min(20000, 4000 * 2 ** (attempt - 1)));   // an outage otherwise becomes a full-speed march of fallback lines into the diary

  };

  // file:// is an opaque origin, so the Cache API and IndexedDB both refuse with a bare SecurityError - and wllama
  // caches by default. That killed local models on exactly the build that needs them: a double-clicked page could
  // never load one, and even a successful download could never persist, so "download once then play offline" is
  // unreachable off a real origin. The disk picker below is the offline path there; the cache is the offline path
  // on the hosted page.
  const CAN_CACHE = (() => { try{ return location.protocol !== "file:" && !!globalThis.caches; }catch(_){ return false; } })();
  // Embedded wllama, present only in a packaged standalone. Both slots must be filled or we fall back to the CDN:
  // half a runtime is worse than none. Built once and memoised - decoding 7 MB of base64 twice is pure waste.
  let wllamaLocal;
  function embeddedWllama(){
    if(wllamaLocal !== undefined) return wllamaLocal;
    const js = ($("wllamajs")?.textContent || "").trim(), wasm = ($("wllamawasm")?.textContent || "").trim();
    if(!js || !wasm) return (wllamaLocal = null);
    try{
      const toBlob = (b64, type) => {
        const s = atob(b64), u = new Uint8Array(s.length);
        for(let i = 0; i < s.length; i++) u[i] = s.charCodeAt(i);
        return URL.createObjectURL(new Blob([u], { type }));
      };
      // The ESM is imported by the MAIN thread, where a blob: URL is fine. The wasm is fetched from INSIDE the worker,
      // and on file:// the page origin is null, so the handle reads blob:null/... which a worker refuses to fetch
      // ("URL scheme blob is not supported" / "Not allowed to load local resource"). A data: URL carries no origin
      // and is accepted, and since the slot already holds base64 it costs no decode at all.
      wllamaLocal = { esm: toBlob(js, "text/javascript"), wasm: { "default": "data:application/wasm;base64," + wasm } };
    }catch(e){ console.error("[NPCAgent] embedded wllama unusable", e); wllamaLocal = null; }

  }

  const PYODIDE_URL = "https://cdn.jsdelivr.net/pyodide/v314.0.2/full/";

  // need no network. The wasm and the stdlib zip are resolved by URL deep inside emscripten, so the only reliable way
  // to serve them is to answer the fetch ourselves - patching fetch covers every path they might be requested through.
  let pyoLocal;
  function embeddedPyodide(){
    if(pyoLocal !== undefined) return pyoLocal;
    const slot = id => ($(id)?.textContent || "").trim();
    const mjs = slot("pyomjs"), asm = slot("pyoasmjs"), wasm = slot("pyowasm"), std = slot("pyostdlib"), lock = slot("pyolock");
    if(!mjs || !asm || !wasm || !std || !lock) return (pyoLocal = null);   // all or nothing: a partial set fails deeper and worse

      const bytes = b64 => { const s = atob(b64), u = new Uint8Array(s.length); for(let i = 0; i < s.length; i++) u[i] = s.charCodeAt(i); return u; };
      const blobUrl = (b64, type) => URL.createObjectURL(new Blob([bytes(b64)], { type }));

        "pyodide.asm.wasm":  [bytes(wasm), "application/wasm"],
        "python_stdlib.zip": [bytes(std),  "application/zip"],
        "pyodide-lock.json": [bytes(lock), "application/json"]
      };

      // real fetch untouched. Serving the lockfile here rather than via lockFileContents avoids guessing whether that
      // option wants text or parsed JSON - the fetch path is the one Pyodide uses by default and is known-good.
      const realFetch = globalThis.fetch.bind(globalThis);

  let ggufBlob = null;   // a .gguf handed over from disk: no fetch, no storage, so it works where the cache cannot
  // A picked file OVERRIDES the typed path, so every place that labels "which model ran" has to say the file, not the
  // HuggingFace path sitting greyed-out in the box. Getting this wrong writes the wrong model onto the archive row.
  // Gate on the tier, not just on the blob: a file picked for the local tier stays loaded across an engine switch, and
  // without this check an endpoint run gets archived under that gguf's name while a completely different model served
  // every turn. The endpoint's own box decides what runs, so there the typed field is the only honest label.
  const localModelName = () => (ggufBlob && $("engine").value === "local")
    ? (ggufBlob.length > 1 ? ggufBlob[0].name.replace(/-\d{5}-of-\d{5}\.gguf$/i, ".gguf") : ggufBlob[0].name)   // name the model, not part 1 of 5

    // path: returning an in-flight load of a DIFFERENT model left the UI naming one file while another was running

      // that says why - without them a bad or unsupported gguf is indistinguishable from a hang.
      // llama.cpp routes its running commentary (slot update_slots, prompt_save, token-type notes) through warn/error

  function hfHint(e, repo, file){

  function fatalText(e){

  function gemmafy(messages){
    let sys = ""; const body = [];
    for(const m of messages){

      if(body.length && body[body.length-1].role === role) body[body.length-1].content += "\n\n" + m.content;

    if(body.length && body[0].role === "user"){                 // fold system into the opening user turn (best instruction placement)

    }
    return [{ role:"user", content: sys || "..." }, ...body];   // empty or assistant-first: lead with a user turn carrying system

  globalThis.wllamaComplete = async (messagesJson, maxTokens, temperature) => {

      }
    }

  function makeWllamaBridge(){
    globalThis._httpRaw = async bodyJson => {
      const p = JSON.parse(bodyJson);

  }

  const PAGE_IS_LOCAL = /^(localhost|127\.|\[::1\])/i.test(location.hostname);

    PAGE_IS_LOCAL ? null :
    /^https?:\/\/(localhost|127\.|\[::1\]|0\.0\.0\.0)/i.test(base) ? "loopback" :
    /^https?:\/\/(192\.168\.|10\.|172\.(1[6-9]|2\d|3[01])\.)/i.test(base) ? "local" : null;

    // plain fetch reaches fine). A hang means the catch below never runs, so the retry never happens and the caller
    // waits forever. Bound the hinted attempt; the plain retry is the one that actually has to work.
    // NEVER clobber a caller's signal: the chat call arms a 120s budget, and replacing it here would abort every
    // generation after the probe's timeout. Only the unsignalled callers (the /models probe) get the short bound.
    try{ return await fetch(url, { ...opts, targetAddressSpace:space, signal: opts?.signal ?? AbortSignal.timeout(4000) }); }

  }

  function makeHttpBridge(){
    globalThis._httpRaw = async bodyJson => {
      try{
        const base = $("baseUrl").value.trim().replace(/\/+$/, "");
        const space = addressSpace(base);
        const headers = { "Content-Type":"application/json" };
        const apiKey = $("apiKey").value.trim();
        if(apiKey) headers.Authorization = "Bearer "+apiKey;

          method:"POST", headers, body:bodyJson, signal:AbortSignal.timeout(120000)
        }, space);

          const b = JSON.parse(bodyJson);   // the model's own ceiling. npc.py ships 32000, which is a request the sim
          const had = "reasoning" in b;     // repeats every turn forever - and each "" is recorded as a real reply.
          delete b.reasoning;
          const shrink = b.max_tokens > 4096; if(shrink) b.max_tokens = 4096;

        }
        if(!res.ok){ writeErr("\r\n[API] HTTP "+res.status+"\r\n"); return ""; }
        const j = await res.json();
        const msg = j.choices?.[0]?.message ?? {};
        return msg.content || msg.reasoning_content || msg.reasoning || "";

        writeErr("\r\n[API] "+(e?.message||e)+"\r\n");
        return "";
      }

  }

  // acquire FIRST, relabel second: committing the dropdown before the load left "Local" on screen while the free relay
  // bridge was still answering. Returns true (local is ours), "superseded" (the user switched while we downloaded -
  // leave their choice alone), or false (load failed).
  async function fallbackToLocal(){
    const g = engineGen;
    const path = modelStash.local || HF_DEFAULT;
    if(!wll){
      write("Loading "+parseGguf(path).file+" for fallback (~2 GB download"+(CAN_CACHE ? ", cached after the first time" : ", not cached here - see the upload button")+")...\r\n");
      try{ await loadLocalModel(path); write("\r\nLocal model ready ("+"CPU wasm).\r\n"); }
      catch(e){ writeErr("\r\n[!] Local fallback failed: "+(e?.message||e)+"\r\n"); return false; }
    }
    if(g !== engineGen){   // they picked another engine mid-download; forcing local back would discard a deliberate choice
      write("[!] Engine changed during the fallback download - keeping your choice.\r\n");
      return "superseded";
    }
    $("engine").value = "local"; engineWas = "local"; ++engineGen; syncBar();   // the UI must show what's actually running, and a stale async switch must not undo it
    curTier = "local"; curModel = path;   // full owner/repo/file.gguf, not the bare filename: sess.cfg.model feeds parseGguf on resume
    try{ pyodide?.globals.set("MODE", "local"); }catch(_){ }
    if(sess){ const cfg = (sess.cfg ||= {}); cfg.mode = "local"; cfg.model = path; sessSave(); }   // the switch handler writes these; this path must too, else every reload replays into the dead relay before falling back again
    return true;
  }

  // dig the provider's real message out of the nested error body, e.g. 503 -> "System is really busy..."
  function apiErrDetail(text){
    try{
      const e = JSON.parse(text)?.error;

  async function freeFallback(bodyJson){
    if(lcFails < 5) return null;
    if(localDead) return "";   // already tried local and it failed - keep retrying the relay each turn, but never re-download the 2 GB model
    // a LIVE check, not a latch: it also catches a switch already in flight (the user parked on a device-code sign-in
    // still shows chatgpt here), and it re-arms by itself the moment they come back to free - with the model cached
    if($("engine").value !== "free") return "";
    writeErr("\r\n[!] Free tier failed "+lcFails+" times - switching to local GGUF.\r\n");
    const ok = await fallbackToLocal();
    if(!ok){ localDead = true; return ""; }
    if(ok !== true) return "";   // superseded: the engine the user picked mid-download owns this run
    makeWllamaBridge();

  function makeFreeLibcurlBridge(){

        b.max_tokens = Math.max(b.max_tokens||0, FREE_MAXTOK);   // reasoning models eat small caps (diary's 1000) as <think> -> empty; floor it here, not in Python, so it survives a mid-run switch

        // one and re-send the SAME turn before counting a failure, so the run only gives up once several independent
        // exits have all refused. A refusal answers in ~250ms, so this costs a fraction of a second.
        let r, hops = 0;
        for(;;){
          try{
            r = await libcurl.fetch(FREE_UP+"/chat/completions", {
              method:"POST", headers:freeHeaders(), body:bodyJson, signal:AbortSignal.timeout(120000)

        }

        if(!r.ok){
          lcFails++;

          // from a global rate limit, and the hop message only ever reached the terminal, so a pasted console log said
          // nothing about whether the relay fallback had even run.
          writeErr("\r\n[API] "+r.status+" on "+(b.model || "?")+" after "+hops+" relay hop"+(hops === 1 ? "" : "s")

      }catch(e){

  async function ensureLibcurl(){   // the WASM signals ready via an event; time out if its CDN script never loads, else run() hangs forever in "waking"

    const wish = sel.dataset.wish, kept = wish && ids.includes(wish);

    const mine = () => gen === freeGen && $("engine").value === "free";   // every DOM write must be gated: a slow probe landing after the user switched tier would wipe that tier's options

        // nobody here can run. Picking it produced a generic refusal that read exactly like a rate limit.

        // tier usable instead of blanking it. The upstream URL is scrubbed: this text reaches the terminal, and the
        // terminal is what gets archived and shared.
        const kept = freeCached();

                   + (kept.length ? "using the last list that worked" : "no cached list yet")
                   + ". The relay reaches the upstream, not you: your own proxy on Custom endpoint skips it entirely."

  function rwFoot(editing){
    $("rwFoot").textContent = editing
      ? "enter continues from here with whatever the field says - clear it to drop this reply and re-ask the model - esc goes back"
      : rwFootIdle;
  }
  function rwEditClose(){ rwEditing = -1; rwEditEvt = null; $("rwEditWrap").style.display = "none"; if(rwOpen) rwFoot(false); }
  function rwEditOpen(){
    const it = rwItems[rwSel];
    if(!it) return;
    if(it.p) return rwCommitPast(it.i);   // a restored turn is rebuilt, not replayed - there is no recorded reply to rewrite
    if(!rwSpoken(it.e) || !rwParse(it.e).said) return rwCommit(it.i);   // your own line, a diary note, or an empty reply: nothing to rewrite, just rewind
    rwEditing = it.i;
    rwEditEvt = it.e;            // identity, not just the index: a divergence can truncate and regrow the log, leaving idx pointing at a DIFFERENT event
    rwEditOrig = rwParse(it.e).said;   // compare against what the FIELD was given, so "unchanged" is a fact rather than a guess about what the control did to the text
    $("rwEdit").value = rwEditOrig;
    $("rwEditWrap").style.display = "block";
    rwFoot(true);
    $("rwEdit").focus(); $("rwEdit").select();
  }
  function rwEditDone(){
    const idx = rwEditing;
    if(!sess || idx < 0 || idx >= sess.log.length || sess.log[idx] !== rwEditEvt) return rwHide();   // run finished, or the log shifted under us, while the field was open
    const e = sess.log[idx], next = $("rwEdit").value;
    if(!next.trim()) return rwCommit(idx);              // cleared: discard the reply itself, the model is asked again
    const cur = rwParse(e);
    // the action is deliberately preserved: a rewritten action would replay as a real move, and the history after it
    // would then describe something that never happened. Words are yours to change, consequences stay the model's.
    const old = e.v;
    if(next !== rwEditOrig) e.v = JSON.stringify({ response: next, action: cur.action });   // vs what the field was HANDED, not vs the parse: the old comparison rewrote any reply the control had reformatted
    rwCommit(idx + 1);
    if(rwCommitted === false) e.v = old;   // the write failed and rwCommit rolled back: the live log must not keep a doctored reply the run never used
  }
  function saveFile(name, text){
    const url = URL.createObjectURL(new Blob([text], {type:"application/json"}));   // Blob encodes the string as UTF-8
    const a = document.createElement("a"); a.href = url; a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);   // defer revoke so the download commits first (immediate revoke = empty file in some browsers)
  }
  // Pointer escape hatch: every action the picker advertises is keyboard-only, so a mouse user who opened it had no
  // way out at all - clicking the backdrop did nothing and there is no Cancel control. Clicking outside now cancels.
  $("rw").addEventListener("mousedown", e => { if(e.target === $("rw")) rwHide(); });
  // Delegated on the LIST, which is static markup - a listener bound to a row died with the next rwRender().
  const rwRow = t => { const r = t?.closest?.("#rwList > div"); return r ? [...r.parentNode.children].indexOf(r) : -1; };
  $("rwList").addEventListener("click", e => {
    const k = rwRow(e.target); if(k < 0) return;
    rwEditClose(); rwSelect(k);   // else the highlight and the open field disagree, and enter rewinds to the row you did NOT pick
  });
  // Double-click IS Enter: rwEditOpen() already routes a restored or unspoken row straight to a rewind and opens the
  // field only where there is one, so both paths share that single decision instead of each guessing at it.
  $("rwList").addEventListener("dblclick", e => {
    const k = rwRow(e.target); if(k < 0) return;
    rwEditClose(); rwSelect(k); rwEditOpen();
  });
  document.addEventListener("keydown", e => {   // capture: the picker must win over xterm's own key handling and the bar inputs
    if(rwOpen){
      if(rwEditing >= 0){
        if(e.key === "Tab"){ e.preventDefault(); e.stopPropagation(); return; }   // Tab out of the textarea lands in the hidden toolbar behind the overlay
        if(e.key === "Enter" && (e.shiftKey || e.altKey)) return;                 // deliberate newline in a multi-line reply; plain Enter still commits
        if(e.key !== "Enter" && e.key !== "Escape") return;   // the field owns arrows, typing and selection
        e.preventDefault(); e.stopPropagation();
        return e.key === "Enter" ? rwEditDone() : (rwEditClose(), rwRender());
      }
      // The overlay is not inert, so without this Tab walked focus into the hidden toolbar and Space activated whatever
      // it landed on - toggling upload consent or hitting Stop, with the confirmation printed behind the overlay.
      if(e.key === "Tab"){ e.preventDefault(); e.stopPropagation(); $("rwBox").focus(); return; }
      if(e.key === " " || e.key === "Spacebar"){ e.preventDefault(); e.stopPropagation(); return; }
      if(e.key === "s" || e.key === "S"){
        e.preventDefault(); e.stopPropagation();
        if(!sess) return;
        const { rid, ...portable } = sess;   // rid is a delete-and-overwrite capability on the archive row; a shared file must not carry it. run() mints a fresh one on load.
        if(portable.cfg){ const { base, ...cfg } = portable.cfg; portable.cfg = cfg; }   // and never publish the endpoint URL: the loader refuses to ACCEPT this field, so it must not be exported either
        return saveFile("npcagent-run-day" + (curDay || 1) + ".json", JSON.stringify(portable));
      }
      if(!["ArrowUp","ArrowDown","Home","End","Enter","Escape"].includes(e.key)) return;
      e.preventDefault(); e.stopPropagation();
      if(e.key === "Enter")  return rwEditOpen();
      if(e.key === "Escape") return rwHide();
      if(e.key === "ArrowUp")        rwSelect(Math.max(0, rwSel - 1));
      else if(e.key === "ArrowDown") rwSelect(Math.min(rwItems.length - 1, rwSel + 1));
      else if(e.key === "Home")      rwSelect(0);
      else                           rwSelect(rwItems.length - 1);
      return;
    }
    const ae = document.activeElement;
    const typing = ae?.matches?.("#bar input:not([type=checkbox]), #bar select");   // only controls where Escape MEANS something: #run and the Share checkbox live in #bar too, and clicking either left it focused, killing the chord for the whole run
    if(e.key === "Escape" && !e.ctrlKey && !e.altKey && !e.metaKey && !e.repeat && !e.isComposing && !typing){   // repeat: held Escape auto-repeats ~30ms apart and would always chord. field/IME: two Escapes there mean "dismiss this", not "rewind"
      // e.timeStamp, not performance.now(): the sim runs Pyodide synchronously on this thread, so delivery can lag
      // a keypress by ~1s. Timing the chord by arrival makes it fail exactly when the run is busiest.
      const t = e.timeStamp;
      if(t - rwEsc < 800){ rwEsc = 0; e.preventDefault(); e.stopPropagation(); rwShow(); }
      else rwEsc = t;
    }
  }, true);
  document.addEventListener("keydown", e => {
    if((e.ctrlKey || e.metaKey) && !e.shiftKey && !e.altKey && (e.key === "c" || e.key === "C")){   // copy terminal selection - works even when the terminal isn't focused (stdin is disabled between player turns)
      if(document.activeElement?.closest?.("#bar, #rw")) return;   // typing in a bar field or the rewind editor: leave Ctrl-C to the input, else a stale terminal selection hijacks it and copyText steals focus back
      const sel = term.getSelection();
      if(sel){ copyText(sel); e.preventDefault(); return; }
    }
    const t = document.activeElement.tagName;
    // exclude BUTTON: Enter on a focused button already fires its click natively; running run() here too would
    // double-fire (Restart-button focused + Enter -> run() sets running, native click then reloads = session wiped)
    if(e.key === "Enter" && !running && !lineReader && t !== "INPUT" && t !== "SELECT" && t !== "BUTTON"){
      sessClear(); run();   // no confirmation anywhere: the owner's call, and the run is archived server-side regardless
    }
  });

  let lastTier = null;
  const modelStash = {};
  function syncBar(){
    const m = $("engine").value;
    $("baseUrl").classList.toggle("hidden", m !== "endpoint");
    $("apiKey").classList.toggle("hidden", m !== "endpoint");
    const picker = (m === "free" || m === "chatgpt");   // both tiers offer a known model list; the others take a free-text id
    $("modelSelect").classList.toggle("hidden", !picker);
    $("model").classList.toggle("hidden", picker);
    $("baseUrl").closest(".fld").classList.toggle("collapsed", m !== "endpoint");   // collapse the whole field (Model field keeps one visible control, so it never collapses)
    $("apiKey").closest(".fld").classList.toggle("collapsed", m !== "endpoint");
    $("model").placeholder = m === "local" ? "owner/repo/file.gguf" : "model (auto)";
    $("gguf").classList.toggle("hidden", m !== "local");   // the disk picker only means anything for the local tier
    $("ggufGet").classList.toggle("hidden", m !== "local");
    $("ggufArrow").classList.toggle("hidden", m !== "local");
    if(m === "local") syncGgufLink();
    if(lastTier !== m){   // each tier keeps its own model text (traitStore's shape): a gguf path is meaningless to an API endpoint, and clearing it outright would lose a hand-typed one
      if(lastTier !== null) modelStash[lastTier] = $("model").value;
      $("model").value = modelStash[m] ?? (m === "local" ? HF_DEFAULT : "");
      // Say it on the SWITCH, not after a 2 GB download has already been spent. Only where the cache is refused:
      // on a real origin the download genuinely is a one-time cost and this warning would be a lie in the other direction.
      if(m === "local" && lastTier !== null && !CAN_CACHE && !ggufBlob)
        write("\r\n\x1b[33m[local]\x1b[0m this page runs from a file, so the browser may refuse to store a downloaded model (it is still attempted). Click the \x1b[1mupload\x1b[0m button and pick a .gguf from your disk instead - no download, and it works with no internet at all.\r\n");
      lastTier = m;
    }
    if(m === "free" && lcReady) probeFreeModels();   // symmetric ownership: each catalog tier stamps modelSelect.dataset.tier and refuses its cache when another tier overwrote the options, so no cross-tier reset (or ordering rule) is needed here
    if(m === "chatgpt" && $("modelSelect").dataset.tier !== "chatgpt") cgptModelList();   // placeholder until sign-in fetches the account's real list
    if(m !== "chatgpt") $("effortFld").classList.add("collapsed");                        // effort is a ChatGPT-tier control only
    barFade();   // collapsing endpoint fields changes overflow without resizing the bar
  }
  let engineWas = $("engine").value, engineGen = 0;
  $("engine").addEventListener("change", async () => {
    const gen = ++engineGen;               // a switch that awaits (model load, sign-in, catalog) can finish AFTER a newer one:
    const stale = () => gen !== engineGen; // without this the older handler installs its bridge over the newer tier and silently bills the wrong provider
    const m = $("engine").value;           // snapshot BEFORE the first await: an OLDER handler's revert() can flip the dropdown under us, and re-reading it later installed one tier's bridge beside another tier's model list
    syncBar();
    if(m !== "chatgpt") usageClear();      // another tier's quota is not this one's: a stale percentage would be a lie
    if(m === "chatgpt" && cgptTok()){   // already signed in: load the real catalog now so Model/Effort are usable BEFORE a run
      try{ await ensureLibcurl(); }catch(_){ }          // waiting beats a bare lcReady check: picking the tier while the WASM is still loading used to silently leave the 3-model default list
      const cat = await cgptFetchModels(cgptTok());
      if(stale()) return;
      $("modelSelect").dataset.tier = "";
      cgptModelList(cat);
      cgptUsageRefresh(true);   // picking the tier is when a user wants to SEE what is left before committing a run
    }
    if(!running){ engineWas = m; return; }   // keep it current between runs too, else a later revert() offers the PREVIOUS run's tier

    // stale guard: a failure here must not yank the dropdown out from under a NEWER switch that already owns the bridge
    const revert = why => { if(stale()) return; writeErr("[!] "+why+" - staying on the previous engine\r\n"); $("engine").value = engineWas; syncBar(); };
    if(m === "local"){
      if(localStale($("model").value)){ write("Switching to local GGUF...\r\n"); try{ await loadLocalModel($("model").value); write("Model ready.\r\n"); }catch(e){ revert(e.message); return; } }
      if(stale()) return;   // a newer switch won while the model loaded
      makeWllamaBridge();
      write("[engine switched to local]\r\n");
    }else if(m === "free"){
      if(!lcReady){ revert("libcurl not ready yet"); return; }
      makeFreeLibcurlBridge();
      write("[engine switched to free]\r\n");
    }else if(m === "chatgpt"){
      if(!lcReady){ revert("libcurl not ready yet"); return; }
      let tok;
      try{ tok = cgptTok() || await cgptLogin(); }catch(e){ revert(e?.message || e); return; }
      const cat = await cgptFetchModels(tok);
      if(stale()) return;   // sign-in + catalog can take a minute; the user may have moved on
      cgptModelList(cat);
      makeChatgptBridge();
      write("[engine switched to ChatGPT account - "+$("modelSelect").value+"]\r\n");
    }else{
      makeHttpBridge();   // reads baseUrl/apiKey live; fields are editable mid-run
      write("[engine switched to endpoint - set Base URL / Key if needed]\r\n");
    }
    // only reached when the switch SUCCEEDED (every failure path returns via revert). A switch used to update the
    // bridge and nothing else, so Python's MODE, the resume config and the archive labels all stayed at startup values.
    engineWas = m;
    curTier = m;
    curModel = (m === "free" || m === "chatgpt") ? $("modelSelect").value : localModelName();
    try{ pyodide?.globals.set("MODE", m); }catch(_){ }        // endpoint-only `reasoning` is gated on this
    if(sess){ const cfg = (sess.cfg ||= {}); cfg.mode = m; cfg.model = curModel; cfg.base = $("baseUrl").value; cfg.effort = $("effort").value; sessSave(); }   // so a reload resumes on the tier that was actually running
  });
  syncBar();

  const traitStore = {};
  $("traitWho").addEventListener("change", () => {
    $("traitVal").value = traitStore[$("traitWho").value] || "";
  });
  $("traitVal").addEventListener("input", () => {
    traitStore[$("traitWho").value] = $("traitVal").value;
  });

  // Days field belongs to AI-only runs; a named player = unlimited, so collapse the whole field
  const syncDays = () => { $("days").closest(".fld").classList.toggle("collapsed", !!$("player").value.trim()); barFade(); };
  $("player").addEventListener("input", syncDays);
  syncDays();

  // Share toggle: default ON, remember an OFF choice; unchecking mid-run also withdraws this run's uploaded data
  if(localStorage.getItem("npcagent-share") === "0") $("contrib").checked = false;
  $("contrib").addEventListener("change", e => {
    if(e.target.checked){ try{ localStorage.removeItem("npcagent-share"); }catch(_){} }
    else{ try{ localStorage.setItem("npcagent-share","0"); }catch(_){} withdrawRun(); }
  });

  function barFade(){   // fade the edge you can scroll toward - a hint the bar scrolls sideways (no wrap, no dropdown)
    const b = $("bar"), max = b.scrollWidth - b.clientWidth;
    b.style.setProperty("--mL", b.scrollLeft > 2 ? "16px" : "0px");
    b.style.setProperty("--mR", b.scrollLeft < max - 2 ? "16px" : "0px");
  }
  $("bar").addEventListener("scroll", barFade, { passive:true });
  new ResizeObserver(barFade).observe($("bar"));
  barFade();

  sess = sessLoad();
  everRan = !!sess;   // a resumed run is not a START state: leaving the button in Load mode during the replay invites overwriting the very session being replayed
  dlSync();
  if(sess){                                   // saved session found: restore its setup and replay it back to where it left off
    const c = sess.cfg || {};
    if(c.mode) $("engine").value = c.mode;
    if(c.base) $("baseUrl").value = c.base;   // the API key is never persisted - re-enter it mid-run if your endpoint needs one
    if(c.player !== undefined) $("player").value = c.player;
    if(c.days) $("days").value = c.days;
    (c.traits || []).forEach((t, i) => { if(t) traitStore[i] = t; });
    $("traitVal").value = traitStore[$("traitWho").value] || "";
    if(c.effort) $("effort").dataset.wish = c.effort;   // OUTSIDE the c.model block: cgptEffortList reads this, and effort must restore even when no model was saved
    if(c.model){
      if(c.mode === "free" || c.mode === "chatgpt") $("modelSelect").dataset.wish = c.model;
      else { modelStash[c.mode] = c.model; lastTier = c.mode; $("model").value = c.model; }   // seed the stash BEFORE syncBar, else it reads this as a tier change and swaps a custom GGUF for the default (a wrong ~2 GB download and a non-deterministic replay)
    }
    syncBar(); syncDays();
    // A session ALWAYS resumes itself. Loading a file is the intent to continue it, and a signed-out ChatGPT is not a
    // reason to add a button: the run replays offline, then simply waits at its first live turn until an engine is
    // picked. Switching the dropdown carries the activation a sign-in popup needs, so the button bought nothing -
    // both paths ended in the same sign-in.
    const snapped = !sess.log.length && !!sess.snap;   // a state restore that has not recorded a turn yet: nothing to replay
    const what = snapped ? "restored state (" + sess.snap.sharegpt.length + " agents, day " + (sess.snap.day || "?") + ", no event log - nothing is replayed)"
                         : "saved session (" + sess.log.length + " events)";
    // The two things a file cannot restore, said once instead of being gated behind a click: who you are, and the
    // endpoint URL (deliberately never trusted from a file - it would point this browser's inference at their server).
    write("\x1b[33m[resume] " + what + (snapped ? " - continuing live" : " - replaying") + ". press Stop to discard it.\x1b[0m\r\n" +
          (snapped ? "\x1b[33m         you are \x1b[1m" + (c.player || "nobody - Subject was blank, so this one runs itself") + "\x1b[0m\x1b[33m.\x1b[0m\r\n" : "") +
          (c.mode === "chatgpt" && !cgptTok() ? "\x1b[33m         signed out of ChatGPT - it replays now and pauses at the first live turn; pick an engine then.\x1b[0m\r\n" : "") +
          (sess.fromFile && c.mode === "endpoint" ? "\x1b[33m         BASE URL is this page's own (" + ($("baseUrl").value || "unset") + ") - a file's is never trusted.\x1b[0m\r\n" : "") +
          "\r\n");
    bootRun = true;   // no user activation on this path: the chatgpt branch must not try to open a sign-in popup
    run();
  }

  /* ==================== FIELD NOTES ====================
   * CORS-open direct (no proxy): api.openai.com, Gemini, Groq, Mistral, Cerebras, OpenRouter
   * Local Flask proxies need an after_request CORS hook (the grok-code venv script has one)
   * ===================================================== */
  </script>
</body>
</html>
