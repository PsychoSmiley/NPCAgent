<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NPCAgent</title>
<meta name="theme-color" content="#10140f">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='3' fill='%230a0d0b'/><circle cx='16' cy='10' r='6' fill='%23d99e57'/><rect x='13' y='8' width='2.5' height='3' rx='1' fill='%230a0d0b'/><rect x='16.5' y='8' width='2.5' height='3' rx='1' fill='%230a0d0b'/><path d='M13.5 14.5 Q16 16.5 18.5 14.5' fill='none' stroke='%230a0d0b' stroke-width='1' stroke-linecap='round'/><rect x='11' y='18' width='10' height='11' rx='3' fill='%23d99e57' opacity='.85'/><circle cx='24' cy='6' r='2' fill='%235fc46b' opacity='.85'/></svg>">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@xterm/xterm@6.0.0/css/xterm.css">
<style>
  /* palette: amber = operator's hand, moss = life inside, blood = death/fault */
  :root{
    --void:#080a09; --glass:#0d100e; --panel:#10140f; --edge:#262d23;
    --fg:#ccd5c4; --muted:#8b9583; --amber:#d99e57; --moss:#5fc46b; --blood:#d96a5a;
    color-scheme:dark;
  }
  *{ box-sizing:border-box; }
  html,body{ height:100%; margin:0; }
  body{ display:flex; flex-direction:column; height:100vh; height:100dvh; background:var(--void); color:var(--fg);
        font:13px/1.4 "Cascadia Code","Cascadia Mono","JetBrains Mono",Consolas,monospace; }

  /* control deck */
  #bar{ flex:0 0 auto; display:flex; flex-wrap:nowrap; align-items:flex-end; gap:4px 6px; padding:6px 8px 5px;
        background:var(--panel); border-bottom:1px solid var(--edge);
        overflow-x:auto; overflow-y:hidden; scrollbar-width:none; -webkit-overflow-scrolling:touch;   /* one scrollable row - scroll right for more, no wrap/dropdown */
        --mL:0px; --mR:0px;   /* edge fades toggled by JS to hint horizontal scroll */
        -webkit-mask-image:linear-gradient(to right, transparent 0, #000 var(--mL), #000 calc(100% - var(--mR)), transparent 100%);
                mask-image:linear-gradient(to right, transparent 0, #000 var(--mL), #000 calc(100% - var(--mR)), transparent 100%); }
  #bar::-webkit-scrollbar{ display:none; }
  #bar > *{ flex:0 0 auto; }   /* never squish - overflow into the scroll instead */
  #brand{ margin-right:8px; padding-bottom:5px; user-select:none; }
  #word{ font-size:15px; font-weight:700; letter-spacing:.1em; line-height:1; white-space:nowrap;
         color:var(--fg); text-decoration:none; }
  #word b{ color:var(--amber); }

  .fld{ display:flex; flex-direction:column; gap:1px; min-width:0; animation:fieldIn .35s ease backwards; }
  .fld .tag{ font-size:11px; line-height:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); transition:color .15s; }  /* same 11px as the inputs; tight line-height keeps control positions unchanged */
  .fld:focus-within .tag{ color:var(--amber); }
  .fld.collapsed{ display:none; }   /* explicit field hide; simpler and less fragile than the previous :has() rule */
  #bar .fld:nth-of-type(2){ animation-delay:.04s; } #bar .fld:nth-of-type(3){ animation-delay:.08s; }
  #bar .fld:nth-of-type(4){ animation-delay:.12s; } #bar .fld:nth-of-type(5){ animation-delay:.16s; }
  #bar .fld:nth-of-type(6){ animation-delay:.2s; } #bar .fld:nth-of-type(7){ animation-delay:.24s; }
  @keyframes fieldIn{ from{ opacity:0; transform:translateY(-4px); } }

  #bar input, #bar select{ height:22px; padding:0 4px; background:var(--void); color:var(--fg);
              border:1px solid var(--edge); border-radius:1px; outline:none; font:inherit; font-size:11px; min-width:0;
              transition:border-color .15s, background-color .15s; }
  #bar input:hover, #bar select:hover{ border-color:#3d473a; }
  #bar input:focus, #bar select:focus{ border-color:var(--amber); }
  #bar input.hidden, #bar select.hidden{ display:none; }
  #bar input:disabled, #bar select:disabled{ opacity:.35; pointer-events:none; }
  #engine{ width:140px; } #baseUrl{ width:170px; } #apiKey{ width:80px; }
  #model, #modelSelect{ width:130px; } #player{ width:75px; } #days{ width:46px; text-align:center; }
  #traitWho{ width:52px; } #traitVal{ width:70px; }
  .fld:has(#traitWho){ flex-direction:row; flex-wrap:wrap; align-items:flex-end; }
  .fld:has(#traitWho) .tag{ width:100%; }
  #days::-webkit-inner-spin-button, #days::-webkit-outer-spin-button{ -webkit-appearance:none; margin:0; }
  #contribBox{ display:flex; align-items:center; gap:4px; align-self:flex-end; height:22px; cursor:pointer; user-select:none; }
  #contribBox .tag{ cursor:pointer; }
  #contribBox input{ accent-color:var(--amber); margin:0; cursor:pointer; }
  #contribBox:hover .tag{ color:var(--amber); }

  #run{ height:22px; padding:0 14px; align-self:flex-end; background:var(--amber); color:#0b0c09;
        border:1px solid var(--amber); border-radius:2px; font:inherit; font-size:11px; font-weight:700;
        letter-spacing:.22em; text-transform:uppercase; cursor:pointer;
        transition:background-color .15s, color .15s, border-color .15s; }
  #run:hover{ background:#e7b06b; border-color:#e7b06b; }
  #run:disabled{ opacity:.4; cursor:default; animation:none; }
  #run:focus-visible{ outline:2px solid var(--fg); outline-offset:2px; }
  #dl{ height:22px; width:24px; margin-left:auto; align-self:flex-end; display:flex; align-items:center; justify-content:center;
        background:var(--void); color:var(--amber); border:1px solid var(--edge); border-radius:2px; padding:0; cursor:pointer;
        transition:border-color .15s, background-color .15s; }   /* margin-left:auto pins dl + Share to the right on wide screens; collapses to 0 when the bar overflows */
  #dl:hover:not(:disabled){ border-color:#3d473a; }
  #dl:focus:not(:disabled), #dl:active:not(:disabled){ border-color:var(--amber); }
  #dl:disabled{ opacity:.3; cursor:default; }
  body[data-state="dormant"] #run, body[data-state="ended"] #run, body[data-state="fault"] #run{
        animation:beacon 2.8s ease-in-out infinite; }
  body[data-state="waking"] #run, body[data-state="live"] #run{
        background:transparent; color:var(--blood); border-color:var(--blood); }
  body[data-state="waking"] #run:hover, body[data-state="live"] #run:hover{ background:rgba(217,106,90,.12); }
  @keyframes beacon{ 0%,100%{ box-shadow:0 0 0 0 rgba(217,158,87,0); } 50%{ box-shadow:0 0 0 4px rgba(217,158,87,.16); } }

  /* the glass: the pane you watch them through */
  #term{ flex:1 1 auto; min-height:0; position:relative; padding:6px 8px 0; overflow:hidden; background:var(--glass);
         margin:6px 8px 0; border:1px solid var(--edge); border-bottom:0; }
  #term::after{ content:""; position:absolute; inset:0; pointer-events:none;
                background:repeating-linear-gradient(0deg, rgba(2,4,3,.20) 0 1px, transparent 1px 3px); }
  .xterm,.xterm-viewport{ background:var(--glass)!important; }
  .xterm-viewport::-webkit-scrollbar{ width:8px; }
  .xterm-viewport::-webkit-scrollbar-thumb{ background:var(--edge); border-radius:4px; }

  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{ animation:none!important; transition:none!important; }
  }
</style>
</head>

<body>
  <div id="bar">
    <div id="brand"><a id="word" href="https://github.com/PsychoSmiley/NPCAgent" target="_blank" rel="noopener">NPC<b>Agent</b></a></div>
    <button id="run">Run</button>
    <label class="fld"><span class="tag">Engine</span>
      <select id="engine" title="Where the NPC brain runs">
        <option value="free" selected>Free (no key)</option>
        <option value="local">Local GGUF (~2 GB)</option>
        <option value="endpoint">Custom endpoint</option>
      </select>
    </label>
    <label class="fld"><span class="tag">Base URL</span>
      <input id="baseUrl" value="http://127.0.0.1:5000/v1" class="hidden" title="OpenAI-compatible base URL (endpoint mode)">
    </label>
    <label class="fld"><span class="tag">Key</span>
      <input id="apiKey" type="password" value="" placeholder="key" class="hidden" title="Bearer key - stays in this page, sent only to your URL">
    </label>
    <label class="fld"><span class="tag">Model</span>
      <select id="modelSelect" title="Free model id"></select>
      <input id="model" placeholder="model (auto)" class="hidden" title="Model id - blank picks automatically">
    </label>
    <label class="fld"><span class="tag">Subject</span>
      <input id="player" value="PersonX" placeholder="AI if empty" title="Your agent name - clear this to run AI-only (then Days appears)">
    </label>
    <label class="fld"><span class="tag">Days</span>
      <input id="days" type="number" value="2" min="1" max="6000" title="AI-only run length (a human run is unlimited; aging ends it). Max 6000 = ~200 in-game years.">
    </label>
    <label class="fld"><span class="tag">Trait</span>
      <select id="traitWho" title="Pick agent to set personality">
        <option value="0">Bob</option><option value="1">Alice</option><option value="2">Chloe</option>
      </select>
      <input id="traitVal" placeholder="none" title="Personality trait for this agent">
    </label>
    <button id="dl" title="Download conversation history (ShareGPT JSON)" disabled><svg width="13" height="13" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 1v7M3.5 5 7 8.5 10.5 5M2 10.5V13h10v-2.5"/></svg></button>
    <label id="contribBox" title="Upload this run's log to a research archive at the end of each in-game day. Opt-in, on by default; your choice is remembered. A player run's upload includes what you type - unchecking mid-run also withdraws anything already sent.">
      <input type="checkbox" id="contrib" checked><span class="tag">Share log daily</span>
    </label>
  </div>
  <div id="term"></div>

  <script src="https://cdn.jsdelivr.net/npm/@xterm/xterm@6.0.0/lib/xterm.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@xterm/addon-fit@0.11.0/lib/addon-fit.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/libcurl.js@0.6.20/libcurl_full.js" defer></script>

  <script type="module">
  /* ------------------------------------------------------------------ config */
  const WLLAMA_ESM  = "https://cdn.jsdelivr.net/npm/@wllama/wllama@3.5.1/esm/index.js";
  const WLLAMA_WASM = { "default": "https://cdn.jsdelivr.net/npm/@wllama/wllama@3.5.1/esm/wasm/wllama.wasm" };
  const HF_DEFAULT  = "mradermacher/Gemma-3-R1984-4B-GGUF/Gemma-3-R1984-4B.Q3_K_M.gguf";
  function parseGguf(s){ let p=(s||HF_DEFAULT).trim()||HF_DEFAULT; const i=p.indexOf("/",p.indexOf("/")+1); if(i<0) p=HF_DEFAULT; const j=p.indexOf("/",p.indexOf("/")+1); return { repo:p.slice(0,j), file:p.slice(j+1) }; }  // <2 slashes (e.g. an endpoint model id after a tier switch) -> fall back to default, never emit garbage repo/file
  const N_CTX       = 8192;
  const MAX_TOKENS_CAP = 256;

  const WISP_RELAY  = "wss://wisp.mercurywork.shop/";
  const FREE_UP    = atob("aHR0cHM6Ly9vcGVuY29kZS5haS96ZW4vdjE="); // upstream hidden from source readers
  const FREE_MAXTOK = 4096;

  // opt-in run-log collection: a Cloudflare Worker (SQLite Durable Object) that only appends. The submit key is
  // low-value (append-only; list/export are gated by a server secret never shipped here), base64 to dodge scrapers.
  const SHARE_BASE  = atob("aHR0cHM6Ly9ucGNhZ2VudC1sb2dzLmVkZ2UtcmVsYXktOXgud29ya2Vycy5kZXY=");
  const SHARE_KEY   = atob("MTY0ODQwY2QzMDE4YjQ5MQ==");

  /* ------------------------------------------------------------------ terminal */
  const $ = id => document.getElementById(id);
  const term = new Terminal({
    convertEol:true, cursorBlink:true, scrollback:8000, fontSize:14, disableStdin:true,
    fontFamily:'"Cascadia Code","Cascadia Mono","JetBrains Mono",Consolas,monospace',
    theme:{
      background:"#0d100e", foreground:"#ccd5c4", cursor:"#d99e57", cursorAccent:"#0d100e",
      selectionBackground:"#d99e5740",
      black:"#141814", red:"#e0705f", green:"#5fc46b", yellow:"#d99e57",
      blue:"#8fb0a8", magenta:"#c09a92", cyan:"#96c2b0", white:"#ccd5c4",
      brightBlack:"#5d685c", brightRed:"#ec9078", brightGreen:"#82d68b", brightYellow:"#e8ba7d",
      brightBlue:"#abc8c0", brightMagenta:"#d4b2aa", brightCyan:"#b2d8c8", brightWhite:"#eaefe3"
    }
  });
  const fit = new FitAddon.FitAddon();
  term.loadAddon(fit);
  term.open($("term"));
  fit.fit();
  const xtTextarea = $("term").querySelector(".xterm-helper-textarea");
  if(xtTextarea) xtTextarea.disabled = true;
  new ResizeObserver(() => fit.fit()).observe($("term"));

  const write    = s => term.write(String(s));
  const writeErr = s => term.write("\x1b[31m"+String(s)+"\x1b[0m");
  // xterm holds its selection in its own model (not a DOM selection), so native Ctrl+C / right-click-copy see nothing.
  // Copy via the clipboard API, with an execCommand fallback for when the page lacks focus/permission.
  function copyText(t){
    if(navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(t).catch(() => fallbackCopy(t));
    else fallbackCopy(t);
  }
  function fallbackCopy(t){
    const ta = document.createElement("textarea"); ta.value = t;
    ta.style.cssText = "position:fixed;top:0;left:0;opacity:0"; document.body.appendChild(ta);
    ta.focus(); ta.select(); try{ document.execCommand("copy"); }catch(_){ } ta.remove();
  }

  /* ------------------------------------------------------------------ readline */
  // buf is an ARRAY of code points and every change redraws the whole line: naive string slicing
  // splits emoji surrogate pairs (rendered "??") and 2-cell glyphs desync the cursor math.
  let lineReader = null;
  const cellW = ch => { const cp = ch.codePointAt(0);
    return (cp > 0xFFFF || (cp >= 0x1100 && cp <= 0x115F) || (cp >= 0x2E80 && cp <= 0xA4CF) ||
            (cp >= 0xAC00 && cp <= 0xD7A3) || (cp >= 0xF900 && cp <= 0xFAFF) ||
            (cp >= 0xFE30 && cp <= 0xFE4F) || (cp >= 0xFF00 && cp <= 0xFF60) || (cp >= 0xFFE0 && cp <= 0xFFE6)) ? 2 : 1; };
  function rlDraw(lr){
    const back = lr.buf.slice(lr.pos).reduce((w, c) => w + cellW(c), 0);
    term.write("\r\x1b[K" + lr.buf.join("") + (back ? "\x1b[" + back + "D" : ""));   // input always starts at column 0 on its own line
  }
  function rlCycle(dir){                       // Tab / arrows swap the whole line for the next completion
    const lr = lineReader;
    if(!lr || !lr.comps.length) return;
    lr.ci = (lr.ci + dir + lr.comps.length) % lr.comps.length;
    lr.buf = Array.from(lr.comps[lr.ci]); lr.pos = lr.buf.length;
    rlDraw(lr);
  }
  term.onData(data => {
    if(!lineReader) return;
    const lr = lineReader;
    if(data === "\t" || data === "\x1b[B"){ rlCycle(1); return; }
    if(data === "\x1b[A"){ rlCycle(-1); return; }
    if(data === "\x1b[D"){ if(lr.pos > 0){ lr.pos--; rlDraw(lr); } return; }
    if(data === "\x1b[C"){ if(lr.pos < lr.buf.length){ lr.pos++; rlDraw(lr); } return; }
    data = data.replace(/\x1b\[[0-9;]*[A-Za-z~]/g, "").replace(/\t/g, "");
    for(const ch of data){
      if(!lineReader) break;
      if(ch === "\r" || ch === "\n"){
        term.write("\r\n");
        const r = lineReader; lineReader = null; r.cleanup(); r.resolve(r.buf.join(""));
      }else if(ch === "\x7f" || ch === "\b"){
        if(lr.pos > 0){ lr.buf.splice(lr.pos - 1, 1); lr.pos--; rlDraw(lr); }
      }else if(ch >= " "){
        lr.buf.splice(lr.pos, 0, ch); lr.pos++; rlDraw(lr);
      }
    }
  });
  const readLineRaw = (promptText, completionsCsv) => {
    const comps = completionsCsv ? String(completionsCsv).split(",").map(s => s.trim()).filter(Boolean) : [];
    write(promptText + (comps.length ? "\x1b[2m(tab / arrows cycle)\x1b[0m" : "") + "\r\n\r\n\r\n");
    requestAnimationFrame(() => term.scrollToBottom());
    setTimeout(() => term.scrollToBottom(), 100);
    term.options.disableStdin = false;
    if(xtTextarea) xtTextarea.disabled = false;
    term.focus();
    return new Promise(resolve => {
      lineReader = { buf:[], pos:0, comps, ci:0, resolve, cleanup:() => {
        term.options.disableStdin = true;
        if(xtTextarea) xtTextarea.disabled = true;
      }};
      if(comps.length){ lineReader.buf = Array.from(comps[0]); lineReader.pos = lineReader.buf.length; term.write(comps[0]); }
    });
  };
  globalThis.terminalReadLine = async (promptText, completionsCsv) => {   // resume seam: replay a recorded input or record the live one
    const c = sessNext("i");
    if(c !== null){ write(promptText.split("\x00TAB:")[0] + "\r\n\x1b[2m» " + c + "\x1b[0m\r\n"); return c; }
    const v = await readLineRaw(promptText, completionsCsv);
    sessPush("i", v);
    return v;
  };
  $("term").addEventListener("dblclick", () => {   // mobile / mouse fallback; skip when double-click selected a word
    if(!term.hasSelection()) rlCycle(1);
  });

  /* ------------------------------------------------------------------ capability gate */
  const HAS_GPU  = !!navigator.gpu;
  const HAS_JSPI = typeof WebAssembly.Suspending === "function";
  const setState = s => document.body.dataset.state = s;
  setState("dormant");
  if(location.hostname.endsWith(".github.io")){
    const user = location.hostname.split(".")[0];
    const repo = location.pathname.split("/").filter(Boolean)[0] || user + ".github.io";
    $("word").href = "https://github.com/" + user + "/" + repo;
  }
  // init libcurl WISP relay for the free tier (CORS bypass via WASM TCP)
  let lcReady = false;
  document.addEventListener("libcurl_load", () => {
    libcurl.set_websocket(WISP_RELAY); lcReady = true;
    if($("engine").value === "free") probeFreeModels();
  });

  write("NPCAgent :: wake, work, trade, remember, die. press \x1b[1;33mRUN\x1b[0m to start.\r\n\r\n");
  if(!HAS_JSPI) writeErr("[!] JSPI missing - requires Chrome/Edge 137+.\r\n\r\n");
  if(!HAS_GPU){   // wllama still runs single-thread CPU wasm; label it slow rather than blocking (fallbacks use it anyway)
    const opt = $("engine").querySelector('option[value="local"]');
    opt.textContent = "Local GGUF (CPU, slow)";
    write("[i] No WebGPU - local tier will run on CPU (slow).\r\n");
  }

  /* ------------------------------------------------------------------ session resume */
  // The sim is deterministic given its LLM replies + player inputs, so the save IS that event log:
  // reload -> re-run the sim feeding recorded events (instant, offline), then go live where you left off.
  // The save survives tab close / crash / FATAL; it dies only on Stop/Restart click, clean completion, or npc.py change.
  const SESS_KEY = "npcagent-session";
  let sess = null, sessI = 0, sessLive = false;
  function sessLoad(){ try{ const s = JSON.parse(localStorage.getItem(SESS_KEY)); return (s && s.v >= 1 && Array.isArray(s.log) && s.log.length) ? s : null; }catch(_){ return null; } }   // accept v1 (pre-rid) and v2; run() mints a rid if missing
  function sessSave(){ try{ localStorage.setItem(SESS_KEY, JSON.stringify(sess)); }catch(_){ } }   // quota/private-mode fail = resume off, sim unaffected
  function sessClear(){ try{ localStorage.removeItem(SESS_KEY); }catch(_){ } sess = null; sessI = 0; sessLive = false; }
  function sessNext(t){   // next recorded event while replaying; null forever once live (the latch - pushes grow the log, so an index check alone would replay freshly recorded events as duplicates)
    if(!sess || sessLive) return null;
    if(sessI >= sess.log.length){ sessLive = true; if(sessI) write("\r\n\x1b[33m[resume] caught up - live.\x1b[0m\r\n"); return null; }
    const e = sess.log[sessI];
    if(e.t !== t){ writeErr("\r\n[resume] log diverged - going live from here.\r\n"); sessLive = true; return null; }
    sessI++;
    return e.v;
  }
  function sessPush(t, v){ if(!sess || !sessLive) return; sess.log.push({t, v}); sessSave(); }

  /* ------------------------------------------------------------------ run-log collector state (opt-in daily save) */
  let curDay = 0, curTier = "", curModel = "", curPlayer = "", curDaysReq = 0, npcVer = "";
  let transcript = [], transcriptLen = 0, errorLines = 0;                 // raw stdout tail (capped) + cumulative JSON-fail count
  let savedOnce = false, lastSave = 0, saving = false, pendingDay = 0, tainted = false;
  let lastDayTime = 0, fastDays = 0, saveInterval = null, visHandler = null;
  const genRid = () => [...crypto.getRandomValues(new Uint8Array(16))].map(b => b.toString(16).padStart(2,"0")).join("");

  /* ------------------------------------------------------------------ bridges */
  let wll = null, pyodide = null, running = false;
  // the sim only ever calls httpComplete; bridges swap _httpRaw underneath so recording survives engine switches
  globalThis.httpComplete = async bodyJson => {
    const c = sessNext("l");
    if(c !== null) return c;
    let out = await globalThis._httpRaw(bodyJson);
    out = String(out ?? "").replace(/<think>[\s\S]*?<\/think>/gi, "");   // drop reasoning before record+return: extract_clean_json strips it anyway (sim result identical), and the session log shrinks ~5-10x so resume survives long runs
    sessPush("l", out);
    return out;
  };

  let wllLoading = null;
  function loadLocalModel(ggufPath){
    if(wllLoading) return wllLoading;   // dedupe concurrent calls (rapid engine toggles) so we never double-download the 2 GB model
    wllLoading = (async () => {
      const { Wllama } = await import(WLLAMA_ESM);
      const { repo, file } = parseGguf(ggufPath);
      const w = new Wllama(WLLAMA_WASM);
      await w.loadModelFromHF({ repo, file }, {
        n_ctx: N_CTX,
        progressCallback: p => {
          const l = p?.loaded || 0, t = p?.total || 0;
          if(t) write(`\rdownloading ${(l/1e9).toFixed(1)}/${(t/1e9).toFixed(1)} GB`);
        }
      });
      wll = w;
    })();
    wllLoading.catch(() => {}).finally(() => { wllLoading = null; });   // side-chain swallows rejection (caller still sees it via the returned promise); avoids unhandledrejection
    return wllLoading;
  }

  // Gemma (and most local GGUF chat templates) reject the 'system' role and demand strict
  // user/assistant alternation. npc.py sends [system, user, assistant, user, ...]. Fold system into
  // the first user turn and merge any consecutive same-role messages so the template never throws.
  function gemmafy(messages){
    let sys = ""; const body = [];
    for(const m of messages){
      if(m.role === "system"){ sys += (sys ? "\n\n" : "") + m.content; continue; }
      const role = m.role === "assistant" ? "assistant" : "user";
      if(body.length && body[body.length-1].role === role) body[body.length-1].content += "\n\n" + m.content;
      else body.push({ role, content: m.content });
    }
    if(body.length && body[0].role === "user"){                 // fold system into the opening user turn (best instruction placement)
      if(sys) body[0].content = sys + "\n\n" + body[0].content;
      return body;
    }
    return [{ role:"user", content: sys || "..." }, ...body];   // empty or assistant-first: lead with a user turn carrying system
  }

  globalThis.wllamaComplete = async (messagesJson, maxTokens, temperature) => {
    for(let attempt = 0; attempt < 2; attempt++){
      try{
        const r = await wll.createChatCompletion({
          messages: gemmafy(JSON.parse(messagesJson)), temperature,
          max_tokens: Math.min(maxTokens || MAX_TOKENS_CAP, MAX_TOKENS_CAP)
        });
        return typeof r === "string" ? r : (r?.choices?.[0]?.message?.content ?? "");
      }catch(e){
        if(attempt === 0){
          writeErr("\r\n[LLM] glue error ("+(e?.message||e)+") - reloading from cache.\r\n");
          try{ await wll.exit(); }catch(_){ }
          try{ await loadLocalModel($("model").value); continue; }catch(_){ wll = null; }   // keep the user's chosen GGUF, not the default
        }
        writeErr("\r\n[LLM ERROR] "+(e?.message||e)+"\r\n");
        return "";
      }
    }
  };

  // local tier goes through the same httpComplete seam as free/endpoint: the sim only ever calls js.httpComplete,
  // so a mid-run engine switch just rebuilds this one function. wllamaComplete ignores the OpenAI-shaped extras.
  function makeWllamaBridge(){
    globalThis._httpRaw = async bodyJson => {
      const p = JSON.parse(bodyJson);
      return globalThis.wllamaComplete(JSON.stringify(p.messages||[]), p.max_tokens||MAX_TOKENS_CAP, p.temperature||0.5);
    };
  }

  const PAGE_IS_LOCAL = /^(localhost|127\.|\[::1\])/i.test(location.hostname);
  const addressSpace = base =>
    PAGE_IS_LOCAL ? null :
    /^https?:\/\/(localhost|127\.|\[::1\]|0\.0\.0\.0)/i.test(base) ? "loopback" :
    /^https?:\/\/(192\.168\.|10\.|172\.(1[6-9]|2\d|3[01])\.)/i.test(base) ? "local" : null;

  async function lnaFetch(url, opts, space){
    if(!space) return fetch(url, opts);
    try{ return await fetch(url, { ...opts, targetAddressSpace:space }); }
    catch(e){ return fetch(url, opts); }
  }

  // endpoint tier: the user's own OpenAI-compatible server (has CORS). No local fallback here - it's their box.
  // Reads baseUrl/apiKey/model live from the DOM each call, so mid-run edits (incl. switching TO endpoint) apply.
  function makeHttpBridge(){
    globalThis._httpRaw = async bodyJson => {
      try{
        const base = $("baseUrl").value.trim().replace(/\/+$/, "");
        const space = addressSpace(base);
        const headers = { "Content-Type":"application/json" };
        const apiKey = $("apiKey").value.trim();
        if(apiKey) headers.Authorization = "Bearer "+apiKey;
        const liveModel = $("model").value.trim();
        if(liveModel){ const b = JSON.parse(bodyJson); b.model = liveModel; bodyJson = JSON.stringify(b); }
        let res = await lnaFetch(base+"/chat/completions", {
          method:"POST", headers, body:bodyJson, signal:AbortSignal.timeout(120000)
        }, space);
        if(res.status === 400 && /"reasoning":/.test(bodyJson)){  // strict APIs (raw OpenAI) 400 on the reasoning arg -> retry without it (match the key, not the word in message content)
          const b = JSON.parse(bodyJson); delete b.reasoning;
          res = await lnaFetch(base+"/chat/completions", { method:"POST", headers, body:JSON.stringify(b), signal:AbortSignal.timeout(120000) }, space);
        }
        if(!res.ok){ writeErr("\r\n[API] HTTP "+res.status+"\r\n"); return ""; }
        const j = await res.json();
        const msg = j.choices?.[0]?.message ?? {};
        return msg.content || msg.reasoning_content || msg.reasoning || "";
      }catch(e){
        writeErr("\r\n[API] "+(e?.message||e)+"\r\n");
        return "";
      }
    };
  }

  async function fallbackToLocal(){
    $("engine").value = "local"; syncBar();   // sync the dropdown even when the model is already cached - the UI must show what's actually running
    if(wll) return;
    write("Loading "+parseGguf().file+" for fallback...\r\n");
    try{ await loadLocalModel(); write("\r\nLocal model ready ("+(HAS_GPU ? "WebGPU" : "CPU")+").\r\n"); }
    catch(e){ writeErr("\r\n[!] Local fallback failed: "+(e?.message||e)+"\r\n"); }
  }

  // dig the provider's real message out of the nested error body, e.g. 503 -> "System is really busy..."
  function apiErrDetail(text){
    try{
      const e = JSON.parse(text)?.error;
      const raw = e?.metadata?.raw;
      if(raw){ try{ const inner = JSON.parse(raw); if(inner?.message) return inner.message; }catch(_){} }
      return e?.message || "";
    }catch(_){ return ""; }
  }

  let lcFails = 0, localDead = false;
  // after 5 consecutive failures (HTTP error OR network reject), drop to local GGUF. Returns the wllama
  // completion to satisfy the in-flight turn, "" if the local load failed, or null if not yet at the threshold.
  async function freeFallback(bodyJson){
    if(lcFails < 5) return null;
    if(localDead) return "";   // already tried local and it failed - keep retrying the relay each turn, but never re-download the 2 GB model
    writeErr("\r\n[!] Free tier failed "+lcFails+" times - switching to local GGUF.\r\n");
    await fallbackToLocal();
    if(!wll){ localDead = true; return ""; }
    makeWllamaBridge();
    const b = JSON.parse(bodyJson);
    return globalThis.wllamaComplete(JSON.stringify(b.messages||[]), b.max_tokens||MAX_TOKENS_CAP, b.temperature||0.5);
  }
  function makeFreeLibcurlBridge(){
    lcFails = 0; localDead = false;
    globalThis._httpRaw = async bodyJson => {
      try{
        const b = JSON.parse(bodyJson);
        const liveModel = $("modelSelect")?.value;
        if(liveModel) b.model = liveModel;
        delete b.reasoning;                       // free models don't take it; a stale MODE=="endpoint" after a mid-run switch would otherwise leak it in
        b.max_tokens = Math.max(b.max_tokens||0, FREE_MAXTOK);   // reasoning models eat small caps (diary's 1000) as <think> -> empty; floor it here, not in Python, so it survives a mid-run switch
        bodyJson = JSON.stringify(b);
        const r = await libcurl.fetch(FREE_UP+"/chat/completions", {
          method:"POST", headers:freeHeaders(), body:bodyJson, signal:AbortSignal.timeout(120000)
        });
        if(!r.ok){
          lcFails++;
          const detail = apiErrDetail(await r.text());
          writeErr("\r\n[API] "+r.status+(detail ? ": "+detail : "")+" (pick another model if it persists)\r\n");
          const fb = await freeFallback(bodyJson);
          return fb !== null ? fb : "";
        }
        lcFails = 0;
        const j = await r.json();
        const msg = j.choices?.[0]?.message ?? {};
        return msg.content || msg.reasoning_content || msg.reasoning || "";
      }catch(e){
        lcFails++;
        writeErr("\r\n[API] "+(e?.message||e)+"\r\n");
        const fb = await freeFallback(bodyJson);   // C1: network reject (dead relay) now also triggers the fallback
        return fb !== null ? fb : "";
      }
    };
  }

  function freeHeaders(){
    const P = atob("eC1vcGVuY29kZS0=");   // required per-request header prefix, kept out of source
    return {
      "Content-Type":"application/json", "Authorization":"Bearer public",
      [P+"client"]:"cli", "User-Agent":atob("b3BlbmNvZGUvbGF0ZXN0LzEuMy4xNS9jbGk="),
      [P+"session"]:crypto.randomUUID(), [P+"project"]:crypto.randomUUID(),
      [P+"request"]:crypto.randomUUID()
    };
  }

  let freeProbe = null;
  async function probeFreeModels(){
    if(freeProbe) return freeProbe;
    freeProbe = (async () => {
      const sel = $("modelSelect");
      sel.innerHTML = "<option value=''>probing...</option>";
      try{
        const res = await libcurl.fetch(FREE_UP+"/models", { headers:freeHeaders() });
        if(!res.ok) throw new Error("HTTP "+res.status);
        const ids = ((await res.json()).data || []).map(m => m.id).filter(i => /free/i.test(i));
        sel.innerHTML = ids.length ? "" : "<option value=''>none found</option>";
        ids.forEach(id => { const o = document.createElement("option"); o.value = id; o.textContent = id; sel.appendChild(o); });
        if(ids.length) sel.value = (sel.dataset.wish && ids.includes(sel.dataset.wish)) ? sel.dataset.wish : ids[0];   // a resumed session keeps its saved model
        else freeProbe = null;
        return ids;
      }catch(e){
        $("modelSelect").innerHTML = "<option value=''>probe failed</option>";
        freeProbe = null;
        return [];
      }
    })();
    return freeProbe;
  }

  /* ------------------------------------------------------------------ run */
  async function run(){
    if(running) return;
    running = true; $("run").textContent = "Stop";
    transcript = []; transcriptLen = 0; errorLines = 0; savedOnce = false; lastSave = 0; saving = false; pendingDay = 0; tainted = false; lastDayTime = 0; fastDays = 0; curDay = 0;
    for(const el of $("bar").querySelectorAll("input,select")) if(!["modelSelect","model","engine","baseUrl","apiKey","contrib"].includes(el.id)) el.disabled = true;
    setState("waking");
    const playerName = $("player").value.trim().replace(/[^A-Za-z0-9_-]/g, "");
    const numDays    = playerName ? 6000 : Math.min(6000, Math.max(1, parseInt($("days").value,10) || 2));   // a human runs unlimited (aging still ends it); AI-only respects the field, cap 6000 (~200 in-game years)
    const mode       = $("engine").value;
    const base       = $("baseUrl").value.trim().replace(/\/+$/, "");
    const apiKey     = $("apiKey").value.trim();
    const modelName  = (mode === "free" ? $("modelSelect").value : $("model").value).trim();
    const space      = addressSpace(base);
    let modelOverride = modelName;
    if(sess && !modelOverride) modelOverride = sess.cfg?.model || "";   // resume can start offline: skip the model probe, replay needs no network
    try{
      if(!HAS_JSPI) throw new Error("JSPI missing (Chrome/Edge 137+ required)");

      if(mode === "endpoint" && space)
        lnaFetch(base+"/models", {}, space).catch(() => {});

      // tier setup + Pyodide/npc.py load in parallel
      const pyodideReady = (async () => {
        if(!pyodide){
          write("Loading Pyodide...\r\n");
          const { loadPyodide } = await import("https://cdn.jsdelivr.net/pyodide/v314.0.2/full/pyodide.mjs");
          pyodide = await loadPyodide({ indexURL:"https://cdn.jsdelivr.net/pyodide/v314.0.2/full/" });
          pyodide.setStdout({ batched: s => {
            let m;
            s = s.replace(/[\x00-\x08\x0b-\x1f\x7f]/g, "");   // strip control chars from sim/LLM text (keeps \t,\n): a model emitting \x1b[ escapes could otherwise clear the screen or forge fake system lines. The harness re-adds its own ANSI colors below.
            // collector taps on the sanitized raw line (before colorization)
            transcript.push(s+"\n"); transcriptLen += s.length + 1;
            while(transcriptLen > 1000000) transcriptLen -= ((transcript.shift() || "").length);
            if(/Failed to extract valid JSON/.test(s)) errorLines++;
            const dm = s.match(/^={5,} DAY (\d+)/);
            if(dm){ const d = +dm[1];
              if(sessLive){ const t = Date.now(); if(lastDayTime && t - lastDayTime < 15000){ if(++fastDays >= 2) tainted = true; } else fastDays = 0; lastDayTime = t; }
              if(d > 1) saveRun(d - 1);          // banner d opens day d, so day d-1 just closed
              curDay = d;
            }
            const vm = s.match(/^={3,} v([\d.]+)/); if(vm) npcVer = vm[1];
            if(/^\[ERROR\]|^\[API\]|^\[LLM|^-> Failed/.test(s)) s = "\x1b[31m"+s+"\x1b[0m";
            else if(/^>>> YOUR TURN/.test(s)) s = "\x1b[1;33m"+s+"\x1b[0m";
            else if(/^--- Time:/.test(s)) s = "\x1b[2m"+s+"\x1b[0m";
            else if(/^-> .*(moved|ate|is working|sleep|wakes)/.test(s)) s = "\x1b[32m"+s+"\x1b[0m";
            else if(/^={10,} DAY/.test(s)) s = "\x1b[1m"+s+"\x1b[0m";
            else if(/^={5,}/.test(s)) s = "\x1b[33m"+s+"\x1b[0m";
            else if(/^\*{3}.*DIED/.test(s)) s = "\x1b[1;31m"+s+"\x1b[0m";
            else if(m = s.match(/^([A-Za-z][\w-]{0,15})(?: \(retry\))?: "/)){   // speaker line: stable per-name color so each voice is distinguishable
              let h = 0; for(const c of m[1]) h = (h * 31 + c.charCodeAt(0)) >>> 0;
              s = "\x1b[1;" + [33, 32, 36, 35, 34, 93, 92, 96, 95, 94][h % 10] + "m" + m[1] + "\x1b[0m" + s.slice(m[1].length);
            }
            write(s+"\n");
            term.scrollToBottom();
          }});
          pyodide.setStderr({ batched: s => writeErr(s+"\n") });
        }
      })();

      let usedLocal = false;
      if(mode === "local"){
        const gguf = $("model").value || HF_DEFAULT;
        if(!wll){
          write("Loading "+parseGguf(gguf).file+" (cached after first download)\r\n");
          try{ await loadLocalModel(gguf); }
          catch(e){ wll = null; throw e; }
          write("\r\nModel ready ("+(HAS_GPU ? "WebGPU" : "CPU, slow")+").\r\n");
        }
        makeWllamaBridge();
        usedLocal = true;
      }else if(mode === "free"){
        if(!lcReady){   // wait for the libcurl WASM to signal ready, but time out if its CDN script never loads (else run() hangs forever in "waking")
          const ok = await Promise.race([
            new Promise(r => document.addEventListener("libcurl_load", () => r(true), {once:true})),
            new Promise(r => setTimeout(() => r(false), 12000))
          ]);
          if(!ok && typeof libcurl === "undefined" && !(sess && sess.log.length)) throw new Error("libcurl.js failed to load (CDN blocked?) - use local GGUF or your own endpoint");   // a resume replays offline; per-call failure handles the rest
        }
        let relayUp = false;
        if(!modelOverride){
          for(let attempt = 0; attempt < 2 && !relayUp; attempt++){
            if(attempt) write("Retrying...\r\n");
            const working = await probeFreeModels();
            if(working.length){ modelOverride = working[0]; relayUp = true; }
            else{ freeProbe = null; if(!attempt) await new Promise(r => setTimeout(r, 3000)); }
          }
        }else{ relayUp = true; }
        if(relayUp){
          write("Free model: "+modelOverride+"\r\n");
          makeFreeLibcurlBridge();
        }else{
          writeErr("[!] Relay down - falling back to local GGUF.\r\n");
          $("engine").value = "local"; syncBar();
          if(!wll){
            write("Loading "+parseGguf().file+" for fallback...\r\n");
            try{ await loadLocalModel(); }
            catch(e){ wll = null; throw new Error("Relay down and local model failed: "+(e?.message||e)); }
            write("\r\nModel ready ("+(HAS_GPU ? "WebGPU" : "CPU, slow")+").\r\n");
          }
          makeWllamaBridge();
          usedLocal = true;
        }
      }else{
        makeHttpBridge();
      }

      await pyodideReady;

      await pyodide.runPythonAsync(`
import sys, types
_r  = types.ModuleType("requests")
_ex = types.ModuleType("requests.exceptions")
class RequestException(Exception): pass
class HTTPError(RequestException): pass
_ex.RequestException = RequestException
_ex.HTTPError = HTTPError
_r.exceptions = _ex
def _post(*a, **k): raise RequestException("network disabled in browser build")
_r.post = _post
sys.modules["requests"] = _r
sys.modules["requests.exceptions"] = _ex
`);

      const npcRes = await fetch("./npc.py", { cache:"no-cache" });
      if(!npcRes.ok) throw new Error("npc.py: HTTP "+npcRes.status);
      const src = await npcRes.text();
      pyodide.globals.set("NPC_SRC", src);
      await pyodide.runPythonAsync(`
import sys, types
_npc = types.ModuleType("npc"); _npc.__name__ = "npc"
exec(compile(NPC_SRC, "npc.py", "exec"), _npc.__dict__)
sys.modules["npc"] = _npc
`);

      traitStore[$("traitWho").value] = $("traitVal").value;
      const traits = [traitStore["0"]||"", traitStore["1"]||"", traitStore["2"]||""];
      if(sess && sess.npcLen !== src.length){ writeErr("[resume] npc.py changed since the save - starting fresh.\r\n"); sessClear(); }
      if(!sess) sess = { v:2, rid: genRid(), npcLen: src.length, cfg: { mode, base, model: modelOverride || modelName, days: numDays, player: playerName, traits }, log: [] };
      if(!sess.rid) sess.rid = genRid();   // resumed v1 session: mint the run-id so daily upserts have a stable key
      pyodide.globals.set("PLAYER_NAME", playerName);
      pyodide.globals.set("MODE", usedLocal ? "local" : mode);
      pyodide.globals.set("MODEL_OVERRIDE", modelOverride || "");
      pyodide.globals.set("TRAITS_JSON", JSON.stringify(traits));   // JSON preserves empty slots + commas in trait text
      await pyodide.runPythonAsync(`
import sys, json
from pyodide.ffi import run_sync
import js
_npc = sys.modules["npc"]

# EVERY tier (local/free/endpoint) goes through js.httpComplete - the one seam a mid-run engine switch rebuilds.
def _llm_post_http(messages, max_tokens=None, temperature=0.5, retries=50, timeout=120, label="LLM"):
    if max_tokens is None: max_tokens = _npc.MAX_RESPONSE_TOKENS
    data = {'model': _npc.MODEL_NAME, 'messages': list(messages),
            'max_tokens': int(max_tokens), 'temperature': float(temperature)}
    if MODE == "endpoint" and _npc.REASONING_ENABLED: data['reasoning'] = {'enabled': True}   # local ignores it, free proxy drops it
    out = run_sync(js.httpComplete(json.dumps(data)))
    return str(out or "")

if MODEL_OVERRIDE: _npc.MODEL_NAME = MODEL_OVERRIDE
_npc.llm_post = _llm_post_http

def _input(prompt=""):
    p = str(prompt); comps = ""
    if "\\x00TAB:" in p:                       # npc.py appends completions for the action menu
        p, comps = p.split("\\x00TAB:", 1)
    return str(run_sync(js.terminalReadLine(p, comps)) or "")
_npc.input = _input

if PLAYER_NAME:
    _npc.PLAYER = PLAYER_NAME
_npc.PERSONALITIES = json.loads(TRAITS_JSON)
`);

      const tierNow = usedLocal ? "local" : mode;
      curTier = tierNow; curModel = modelOverride || modelName || ""; curPlayer = playerName; curDaysReq = numDays;
      setState("live");
      if(playerName) write("\r\n\x1b[33m[SUBJECT]\x1b[0m You are "+playerName+" - type response + action on your turns.\r\n");
      if(playerName && $("contrib").checked) write("\r\n\x1b[1;33m[SHARE]\x1b[0m Player run: its log, \x1b[1mincluding what you type\x1b[0m\x1b[1;33m, uploads daily to a research archive. Uncheck 'Share log daily' to keep it local (that also withdraws anything already sent).\x1b[0m\r\n");
      write("\r\n\x1b[2m=== run start :: "+tierNow+" :: "+(playerName ? "player (unlimited)" : numDays+" day(s)")+" ===\x1b[0m\r\n");
      $("dl").disabled = false;   // history downloadable mid-run (agents populate as run_simulation starts)
      saveInterval = setInterval(() => { if(sessLive) saveRun(curDay); }, 180000);   // periodic save catches abandoners who never hit a day boundary
      visHandler = () => { if(document.visibilityState === "hidden") saveRun(curDay, { keepalive:true, quiet:true }); };
      document.addEventListener("visibilitychange", visHandler);
      await pyodide.runPythonAsync("import sys; sys.modules['npc'].run_simulation(num_days="+numDays+")");
      await saveRun(curDay || numDays, { final:true });   // final save BEFORE sessClear (needs sess.rid + sessLive)
      sessClear();   // clean completion: nothing left to resume
      write("\r\n\x1b[2m=== run complete ===\x1b[0m\r\n");
    }catch(e){
      try{ await saveRun(curDay, { final:true, quiet:true }); }catch(_){}   // best-effort archive of a crashed run
      setState("fault");
      writeErr("\r\n[FATAL] "+(e?.stack || e)+"\r\n");
    }finally{
      if(saveInterval){ clearInterval(saveInterval); saveInterval = null; }
      if(visHandler){ document.removeEventListener("visibilitychange", visHandler); visHandler = null; }
      if(lineReader){ const r = lineReader; lineReader = null; r.cleanup(); }   // a FATAL mid-player-turn leaves a stale reader: stdin stuck enabled, Enter-to-restart blocked
      running = false; $("run").textContent = "Restart";
      for(const el of $("bar").querySelectorAll("input,select")) el.disabled = false;
      syncBar();
      if(document.body.dataset.state === "live") setState("ended");
    }
  }
  $("run").addEventListener("click", () => {
    if(running){ sessClear(); location.reload(); }   // Stop = the one deliberate way to forget a session
    else { sessClear(); run(); }                     // Run/Restart click = fresh start (auto-resume never passes through here)
  });
  // read each NPC's history straight from Python -> ShareGPT-style JSON (one conversation per agent, its own POV)
  function buildHistoryJson(){
    return pyodide.runPython(`
import sys, json as _j
_m = sys.modules.get("npc")
_a = getattr(_m, "all_agents", None) if _m else None
def _conv(a):
    c = [{"from": ("system" if m["role"]=="system" else "human" if m["role"]=="user" else "gpt"), "value": m["content"]} for m in a["history"]]
    while c and c[-1]["from"] != "gpt": c.pop()   # drop trailing incomplete turns (a prompt snapshotted mid-turn) so every conversation ends on an assistant reply
    return c
_out = [{"id": a["name"], "conversations": _conv(a)} for a in _a] if _a else []
_out = [o for o in _out if any(t["from"] == "gpt" for t in o["conversations"])]   # skip agents with no completed exchange
_j.dumps(_out, ensure_ascii=False, indent=1) if _out else ""`);
  }

  // Envelope core from Python: the ShareGPT export PLUS the diaries (the sim's own bounded run-summary) and stats
  // the old upload threw away, plus a quality tally. One bounded row holds a whole run without a delta table.
  const ENV_PY = `
import sys, json as _j
_m = sys.modules.get("npc")
_a = getattr(_m, "all_agents", None) if _m else None
FB = "Let me think about this carefully first."
def _conv(a):
    c = [{"from": ("system" if m["role"]=="system" else "human" if m["role"]=="user" else "gpt"), "value": m["content"]} for m in a["history"]]
    while c and c[-1]["from"] != "gpt": c.pop()
    return c
if not _a:
    _env = ""
else:
    g=f=e=ch=0
    for a in _a:
        for m in a["history"]:
            if m["role"] != "assistant": continue
            g += 1
            try: r = _j.loads(m["content"]).get("response","")
            except Exception: r = ""
            r = (r or "").strip(); ch += len(r)
            if not r or r == "...": e += 1
            elif r == FB: f += 1
    sg = [{"id":a["name"],"conversations":_conv(a)} for a in _a]
    sg = [o for o in sg if any(t["from"]=="gpt" for t in o["conversations"])]
    diaries = {a["name"]: a.get("diary",[]) for a in _a}
    stats = {a["name"]: {"money":a.get("money"),"age":_m.agent_age(a),"dead":a.get("dead",False)} for a in _a}
    _env = _j.dumps({"sharegpt":sg,"diaries":diaries,"stats":stats,"quality":{"gpt":g,"fb":f,"empty":e,"chars":ch}}, ensure_ascii=False)
_env`;

  function buildEnvelope(day){
    let coreStr; try{ coreStr = pyodide.runPython(ENV_PY); }catch(_){ return null; }
    if(!coreStr) return null;
    let core; try{ core = JSON.parse(coreStr); }catch(_){ return null; }
    if(!core.sharegpt || !core.sharegpt.length) return null;
    const tr = transcript.join("");
    return { v:2, npc:npcVer, npcLen:(sess&&sess.npcLen)||0, tier:curTier, model:curModel,
             player:!!curPlayer, daysReq:curDaysReq, day:day|0, quality:core.quality,
             sharegpt:core.sharegpt, diaries:core.diaries, stats:core.stats,
             transcript: tr.length > 500000 ? tr.slice(-500000) : tr };
  }

  // reject junk before it ever leaves the browser: too little content, too many parse-fail/empty replies, or a
  // model that spent the run failing JSON - all signals of a broken endpoint or a garbage model, not real data.
  function qualityOk(q){
    if(!q || q.gpt < 6) return false;
    if((q.fb + q.empty) / q.gpt >= 0.3) return false;
    if(q.chars < 400) return false;
    if(errorLines > q.gpt * 0.3) return false;
    return true;
  }

  // One run = one row, blind-upserted daily under the run's capability id (sess.rid). Throttled to >=60s between
  // network saves; gated on share + live + not-tainted. Never throws into the sim.
  async function saveRun(day, opts){
    opts = opts || {};
    if(!$("contrib")?.checked || !sess || !sess.rid || !sessLive || tainted) return;
    const nowT = Date.now();
    if(saving){ pendingDay = Math.max(pendingDay, day); return; }
    if(!opts.final && !opts.keepalive && nowT - lastSave < 60000){ pendingDay = Math.max(pendingDay, day); return; }
    saving = true;
    try{
      const env = buildEnvelope(day);
      if(!env || !qualityOk(env.quality)) return;
      const body = JSON.stringify(env);
      if(opts.keepalive && body.length > 55000) return;   // keepalive fetch body caps at ~64 KB
      const meta = encodeURIComponent([curTier, curModel||"?", "d"+env.day, curPlayer?"player":"ai", new Date().toISOString().slice(0,10)].join(" ")).slice(0,290);
      const r = await fetch(SHARE_BASE+"/submit?k="+encodeURIComponent(SHARE_KEY)+"&rid="+sess.rid+"&day="+env.day+"&meta="+meta,
        { method:"POST", headers:{"content-type":"application/json"}, body, keepalive: !!opts.keepalive });
      if(r.ok){ lastSave = Date.now(); savedOnce = true;
        if(!opts.quiet){ const j = await r.json().catch(() => ({})); write("\r\n\x1b[2m[shared] day "+(j.day ?? env.day)+" archived (save "+(j.saves ?? "?")+"). uncheck 'Share log daily' to opt out + withdraw.\x1b[0m\r\n"); } }
      else if(!opts.quiet && r.status !== 400) write("\r\n\x1b[2m[share] skipped (HTTP "+r.status+")\x1b[0m\r\n");
    }catch(_){}
    finally{
      saving = false;
      if(pendingDay && sessLive && !opts.keepalive){ const p = pendingDay; pendingDay = 0; if(Date.now() - lastSave >= 60000) saveRun(p); }
    }
  }

  async function withdrawRun(){   // capability-scoped self-erasure of THIS run's uploaded data
    if(!sess || !sess.rid || !savedOnce) return;
    try{ await fetch(SHARE_BASE+"/withdraw?k="+encodeURIComponent(SHARE_KEY)+"&rid="+sess.rid, { method:"POST", keepalive:true });
      savedOnce = false; write("\r\n\x1b[2m[share] this run's uploaded data withdrawn.\x1b[0m\r\n");
    }catch(_){}
  }

  $("dl").addEventListener("click", () => {
    let json;
    try{ json = buildHistoryJson(); }catch(e){ writeErr("\r\n[download] "+(e?.message||e)+"\r\n"); return; }
    if(!json){ writeErr("\r\n[download] no history yet - run first.\r\n"); return; }
    const url = URL.createObjectURL(new Blob([json], {type:"application/json"}));
    const a = document.createElement("a"); a.href = url; a.download = "npcagent-history.json";
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);   // defer revoke so the download commits first (immediate revoke = empty file in some browsers)
  });
  document.addEventListener("keydown", e => {
    if((e.ctrlKey || e.metaKey) && !e.shiftKey && !e.altKey && (e.key === "c" || e.key === "C")){   // copy terminal selection - works even when the terminal isn't focused (stdin is disabled between player turns)
      const sel = term.getSelection();
      if(sel){ copyText(sel); e.preventDefault(); return; }
    }
    const t = document.activeElement.tagName;
    // exclude BUTTON: Enter on a focused button already fires its click natively; running run() here too would
    // double-fire (Restart-button focused + Enter -> run() sets running, native click then reloads = session wiped)
    if(e.key === "Enter" && !running && !lineReader && t !== "INPUT" && t !== "SELECT" && t !== "BUTTON"){
      sessClear(); run();
    }
  });

  function syncBar(){
    const m = $("engine").value;
    $("baseUrl").classList.toggle("hidden", m !== "endpoint");
    $("apiKey").classList.toggle("hidden", m !== "endpoint");
    $("modelSelect").classList.toggle("hidden", m !== "free");
    $("model").classList.toggle("hidden", m === "free");
    $("baseUrl").closest(".fld").classList.toggle("collapsed", m !== "endpoint");   // collapse the whole field (Model field keeps one visible control, so it never collapses)
    $("apiKey").closest(".fld").classList.toggle("collapsed", m !== "endpoint");
    $("model").placeholder = m === "local" ? "owner/repo/file.gguf" : "model (auto)";
    if(m === "local" && !$("model").value) $("model").value = HF_DEFAULT;
    if(m === "free" && lcReady) probeFreeModels();
    barFade();   // collapsing endpoint fields changes overflow without resizing the bar
  }
  $("engine").addEventListener("change", async () => {
    syncBar();
    if(!running) return;                          // Python only ever calls js.httpComplete, so each branch just rebuilds it
    const m = $("engine").value;
    if(m === "local"){
      if(!wll){ write("Switching to local GGUF...\r\n"); try{ await loadLocalModel($("model").value); write("Model ready.\r\n"); }catch(e){ writeErr("[!] "+e.message+"\r\n"); return; } }
      makeWllamaBridge();
      write("[engine switched to local]\r\n");
    }else if(m === "free"){
      if(!lcReady){ writeErr("[!] libcurl not ready yet.\r\n"); return; }
      makeFreeLibcurlBridge();
      write("[engine switched to free]\r\n");
    }else{
      makeHttpBridge();   // reads baseUrl/apiKey live; fields are editable mid-run
      write("[engine switched to endpoint - set Base URL / Key if needed]\r\n");
    }
  });
  syncBar();

  const traitStore = {};
  $("traitWho").addEventListener("change", () => {
    $("traitVal").value = traitStore[$("traitWho").value] || "";
  });
  $("traitVal").addEventListener("input", () => {
    traitStore[$("traitWho").value] = $("traitVal").value;
  });

  // Days field belongs to AI-only runs; a named player = unlimited, so collapse the whole field
  const syncDays = () => { $("days").closest(".fld").classList.toggle("collapsed", !!$("player").value.trim()); barFade(); };
  $("player").addEventListener("input", syncDays);
  syncDays();

  // Share toggle: default ON, remember an OFF choice; unchecking mid-run also withdraws this run's uploaded data
  if(localStorage.getItem("npcagent-share") === "0") $("contrib").checked = false;
  $("contrib").addEventListener("change", e => {
    if(e.target.checked){ try{ localStorage.removeItem("npcagent-share"); }catch(_){} }
    else{ try{ localStorage.setItem("npcagent-share","0"); }catch(_){} withdrawRun(); }
  });

  function barFade(){   // fade the edge you can scroll toward - a hint the bar scrolls sideways (no wrap, no dropdown)
    const b = $("bar"), max = b.scrollWidth - b.clientWidth;
    b.style.setProperty("--mL", b.scrollLeft > 2 ? "16px" : "0px");
    b.style.setProperty("--mR", b.scrollLeft < max - 2 ? "16px" : "0px");
  }
  $("bar").addEventListener("scroll", barFade, { passive:true });
  new ResizeObserver(barFade).observe($("bar"));
  barFade();

  sess = sessLoad();
  if(sess){                                   // saved session found: restore its setup and replay it back to where it left off
    const c = sess.cfg || {};
    if(c.mode) $("engine").value = c.mode;
    if(c.base) $("baseUrl").value = c.base;   // the API key is never persisted - re-enter it mid-run if your endpoint needs one
    if(c.player !== undefined) $("player").value = c.player;
    if(c.days) $("days").value = c.days;
    (c.traits || []).forEach((t, i) => { if(t) traitStore[i] = t; });
    $("traitVal").value = traitStore[$("traitWho").value] || "";
    if(c.mode === "free" && c.model) $("modelSelect").dataset.wish = c.model;
    else if(c.model) $("model").value = c.model;
    syncBar(); syncDays();
    write("\x1b[33m[resume] saved session ("+sess.log.length+" events) - replaying. press Stop to discard it.\x1b[0m\r\n\r\n");
    run();
  }

  /* ==================== FIELD NOTES ====================
   * CORS-open direct (no proxy): api.openai.com, Gemini, Groq, Mistral, Cerebras, OpenRouter
   * Local Flask proxies need an after_request CORS hook (the grok-code venv script has one)
   * ===================================================== */
  </script>
</body>
</html>
